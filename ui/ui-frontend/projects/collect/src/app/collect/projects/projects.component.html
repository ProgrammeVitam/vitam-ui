<mat-sidenav-container [autosize]="true" [hasBackdrop]="false">
  <mat-sidenav
    [ngClass]="isLPExtended ? 'extended-lateral-panel' : 'normal-lateral-panel'"
    #panel
    mode="side"
    position="end"
    [fixedInViewport]="true"
  >
    @if (projectId) {
      <app-project-preview
        [projectId]="projectId"
        (previewClose)="closePanel()"
        (showExtendedLateralPanel)="showExtendedLateralPanel()"
        (backToNormalLateralPanel)="backToNormalLateralPanel()"
      >
      </app-project-preview>
    }
  </mat-sidenav>

  <mat-sidenav-content id="projectList">
    <div class="vitamui-heading">
      <vitamui-title-breadcrumb>
        <h5>{{ 'COLLECT.APP_BREADCRUMB' | translate }}</h5>
      </vitamui-title-breadcrumb>
      <vitamui-banner (search)="onSearch($event)" [searchbarPlaceholder]="'COLLECT.SEARCH_PLACEHOLDER' | translate">
        <button class="btn primary" (click)="openCreateProjectDialog()">
          <span>{{ 'COLLECT.CREATE_PROJECT' | translate }}</span>
        </button>
      </vitamui-banner>
    </div>
    <div class="vitamui-content">
      <div></div>
      <div class="mt-3">
        <mat-tab-group class="vitamui-tab-group" [(selectedIndex)]="selectedTabIndex">
          <mat-tab [label]="'COLLECT.PROJECTS_TAB_LABEL' | translate: { nb: projectListComponent()?.totalElements() ?? 0 }">
            <app-project-list (previewProjectDetailsPanel)="openProjectDetailsPanel($event)"></app-project-list>
          </mat-tab>
          <mat-tab
            [label]="
              'COLLECT.TRANSACTIONS_TO_PROCESS.TAB_LABEL' | translate: { nb: transactionsToProcessListComponent()?.totalElements() ?? 0 }
            "
          >
            <app-transactions-to-process-list></app-transactions-to-process-list>
          </mat-tab>
        </mat-tab-group>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
