<mat-sidenav-container [autosize]="true" [hasBackdrop]="false">
  <mat-sidenav
    [ngClass]="isLPExtended ? 'extended-lateral-panel' : 'normal-lateral-panel'"
    #panel
    mode="side"
    position="end"
    [fixedInViewport]="true"
  >
    @if (projectId) {
      <app-project-preview
        [projectId]="projectId"
        (previewClose)="closePanel()"
        (showExtendedLateralPanel)="showExtendedLateralPanel()"
        (backToNormalLateralPanel)="backToNormalLateralPanel()"
      >
      </app-project-preview>
    }
  </mat-sidenav>

  <mat-sidenav-content id="projectList">
    <div class="vitamui-heading">
      <vitamui-title-breadcrumb>
        <h5>{{ 'COLLECT.APP_BREADCRUMB' | translate }}</h5>
      </vitamui-title-breadcrumb>
      <vitamui-banner (search)="onSearch($event)" [searchbarPlaceholder]="'COLLECT.SEARCH_PLACEHOLDER' | translate">
        <button class="btn primary" (click)="openCreateProjectDialog()">
          <span>{{ 'COLLECT.CREATE_PROJECT' | translate }}</span>
        </button>
      </vitamui-banner>
    </div>
    <div class="vitamui-content">
      <div></div>
      <div class="mt-3">
        <app-project-list
          [tenantIdentifier]="tenantIdentifier"
          (previewProjectDetailsPanel)="openProjectDetailsPanel($event)"
        ></app-project-list>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
