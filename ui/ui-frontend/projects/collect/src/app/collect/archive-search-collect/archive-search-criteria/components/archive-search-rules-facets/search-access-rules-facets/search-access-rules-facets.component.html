<div id="facet-row">
  <div id="count-facet-details">
    <vitamui-facet
      [facetDetails]="archiveUnitsCountFacetDetails"
      [facetTitle]="'COLLECT.FACETS.ACCESS_RULE.ARCHIVE_UNITS_COUNT' | translate"
    ></vitamui-facet>
  </div>
  <div id="rules-facet-details">
    <vitamui-facet [facetDetails]="rulesFacetDetails" [facetTitle]="'COLLECT.FACETS.ACCESS_RULE.RULES_COUNT' | translate"></vitamui-facet>
  </div>
  <div id="expired-rules-facet-details">
    <vitamui-facet
      [facetDetails]="expiredRulesFacetDetails"
      [facetSubTitle]="('COLLECT.FACETS.ACCESS_RULE.FROM_DATE' | translate) + ' ' + dateFilterValue"
      [facetTitle]="'COLLECT.FACETS.ACCESS_RULE.EXPIRED_RULES' | translate"
    ></vitamui-facet>
  </div>
</div>
