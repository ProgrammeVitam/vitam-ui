<vitamui-dialog-header [stepper]="stepper" [title]="'COLLECT.UPDATE_UNITS_METADATA.ACTION_TITLE' | translate"></vitamui-dialog-header>

<vitamui-stepper #stepper>
  <!-- Step 1 -->
  <cdk-step>
    <mat-dialog-content>
      <div class="text large bold my-2">
        {{ 'COLLECT.UPDATE_UNITS_METADATA.ACTION_SUB_TITLE' | translate }}
        <i class="vitamui-icon vitamui-icon-info" [vitamuiTooltip]="'COLLECT.UPDATE_UNITS_METADATA.ACTION_DESCRIPTION' | translate"></i>
      </div>

      @if (isLoadingData) {
        <div class="vitamui-min-content">
          <mat-spinner class="vitamui-spinner large"></mat-spinner>
        </div>
      } @else {
        <vitamui-file-selector [extensions]="['.csv', '.jsonl']" [multiple]="false" (filesChanged)="handleFiles($event)">
        </vitamui-file-selector>
      }
    </mat-dialog-content>
    <mat-dialog-actions>
      <button (click)="updateUnitsMetadata()" [disabled]="!fileToUpload || isLoadingData" class="btn primary" type="button">
        {{ 'COLLECT.UPDATE_UNITS_METADATA.UPDATE_CONFIRM' | translate }}
      </button>
      <button (click)="onCancel()" class="btn cancel link" [disabled]="isLoadingData" type="button">
        {{ 'COLLECT.UPDATE_UNITS_METADATA.UPDATE_CANCEL' | translate }}
      </button>
    </mat-dialog-actions>
  </cdk-step>
</vitamui-stepper>

<ng-template #confirmDeleteUpdateUnitsMetadataDialog>
  <vitamui-dialog-header [title]="'COLLECT.UPDATE_UNITS_METADATA.CANCEL_UPDATE_TO_CONFIRM' | translate"></vitamui-dialog-header>
  <mat-dialog-actions>
    <button (click)="onConfirmAction()" class="btn primary btn-confirm-dialog">
      {{ 'COLLECT.UPDATE_UNITS_METADATA.CONFIRM' | translate }}
    </button>
    <button type="button" (click)="onCloseAction()" class="btn cancel link">
      {{ 'COLLECT.UPDATE_UNITS_METADATA.UPDATE_CANCEL' | translate }}
    </button>
  </mat-dialog-actions>
</ng-template>
