<vitamui-dialog-header
  [stepper]="stepper"
  [subhead]="'COLLECT.ADD_UNITS.TITLE' | translate"
  [title]="[
    'COLLECT.ADD_UNITS.UPLOAD_FILES_TITLE' | translate,
    'COLLECT.ADD_UNITS.ATTACHMENT_POSITION_TITLE' | translate,
    'COLLECT.MODAL.UPLOAD_FILES' | translate,
  ]"
></vitamui-dialog-header>

<vitamui-stepper #stepper [(selectedIndex)]="stepIndex">
  <!-- stepIndex 1 : upload de fichier -->
  <cdk-step>
    <mat-dialog-content>
      @if (isLoading) {
        <div class="vitamui-min-content">
          <mat-spinner class="vitamui-spinner large"></mat-spinner>
        </div>
      } @else {
        <vitamui-file-selector
          [directoryMode]="true"
          [maxSizeInBytes]="uploadMaxSizeInBytes"
          [multiple]="true"
          [formControl]="filesToUploadControl"
        >
        </vitamui-file-selector>
      }
    </mat-dialog-content>

    <mat-dialog-actions>
      <vitamui-next-step [disabled]="filesToUploadControl.invalid"></vitamui-next-step>
      <button (click)="cancel()" class="btn cancel link" type="button">
        {{ 'COMMON.UNDO' | translate }}
      </button>
    </mat-dialog-actions>
  </cdk-step>

  <!-- stepIndex 2 : Définir la position fixe de rattachement -->
  <cdk-step>
    <mat-dialog-content>
      <div class="main-content">
        <div class="form-group">
          @if (projectUnits) {
            <vitamui-library-filing-plan [mode]="FilingPlanMode.SOLO" [formControl]="linkParentIdControl" [dataSource]="projectUnits">
            </vitamui-library-filing-plan>
          }
        </div>
      </div>
    </mat-dialog-content>
    <mat-dialog-actions>
      <div>
        <button (click)="validateAndUpload()" [disabled]="isLoading" class="btn primary" type="button">
          {{ 'COMMON.SUBMIT' | translate }}
        </button>
        <button (click)="cancel()" [disabled]="isLoading" class="btn cancel link" type="button">
          {{ 'COMMON.UNDO' | translate }}
        </button>
      </div>
      <vitamui-previous-step></vitamui-previous-step>
    </mat-dialog-actions>
  </cdk-step>

  <!-- stepIndex 3 : Zip des fichiers et upload -->
  <cdk-step>
    <mat-dialog-content>
      <div class="main-content">
        <table>
          <thead>
            <tr>
              <th>{{ 'COLLECT.UPLOAD.ZIP_NAME' | translate }}</th>
              <th>{{ 'COLLECT.UPLOAD.WEIGHT' | translate }}</th>
              <th>{{ 'COLLECT.UPLOAD.ZIP_TRACKING_TITLE' | translate }}</th>
              <th>{{ 'COLLECT.UPLOAD.STATUS' | translate }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="zipFileStatus$ | async as zippedFile">
              <td>{{ zippedFile?.name }}</td>
              <td>{{ zippedFile?.size | fileSize }}</td>
              <td>
                <vitamui-common-progress-bar [percent]="zippedFile?.currentFileUploadedSize"></vitamui-common-progress-bar>
              </td>
              <td>
                <vitamui-common-progress-bar [percent]="zippedFile?.uploadedSize"></vitamui-common-progress-bar>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </mat-dialog-content>
    <mat-dialog-actions>
      <button (click)="close(true)" [disabled]="isLoading" class="btn primary" type="button">
        {{ 'COMMON.CLOSE' | translate }}
      </button>
    </mat-dialog-actions>
  </cdk-step>
</vitamui-stepper>

<ng-template #confirmCancelDialog>
  <vitamui-dialog-header [title]="'COLLECT.UPDATE_UNITS_METADATA.CANCEL_UPDATE_TO_CONFIRM' | translate"></vitamui-dialog-header>
  <mat-dialog-actions>
    <button (click)="close(false)" class="btn primary btn-confirm-dialog">
      {{ 'COLLECT.UPDATE_UNITS_METADATA.CONFIRM' | translate }}
    </button>
    <button type="button" (click)="closeConfirmDialog()" class="btn cancel link">
      {{ 'COLLECT.UPDATE_UNITS_METADATA.UPDATE_CANCEL' | translate }}
    </button>
  </mat-dialog-actions>
</ng-template>
