<vitamui-dialog-header [subhead]="data.subTitleDialog" [title]="data.titleDialog"></vitamui-dialog-header>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="gap-3 align-items-stretch">
    <div class="row">
      <div class="col-10 form-control" *ngIf="externalIdentifierEnabled">
        <vitamui-input
          class="col-9 px-0"
          [placeholder]="'PROFILE.POP_UP_CREATION_NOTICE.IDENTIFIER' | translate"
          formControlName="identifier"
        >
        </vitamui-input>
      </div>
    </div>

    <div class="row">
      <div class="col-10 form-control">
        <vitamui-input class="col-9 px-0" formControlName="name" [placeholder]="'PROFILE.POP_UP_CREATION_NOTICE.NAME' | translate">
        </vitamui-input>
      </div>
    </div>

    <div class="row">
      <div class="col-10 form-control">
        <vitamui-input
          [textarea]="true"
          formControlName="description"
          [placeholder]="'PROFILE.POP_UP_CREATION_NOTICE.DESCRIPTION' | translate"
          style="width: 100%"
        >
        </vitamui-input>
      </div>
    </div>

    <div *ngIf="modePUA" class="row">
      <div class="col-10 form-control">
        <div class="d-flex justify-content-between align-items-center py-1 px-2 mb-2">
          <vitamui-slide-toggle formControlName="additionalProperties">
            {{ 'PROFILE.POP_UP_CREATION_NOTICE.ALLOW_METADATA' | translate }}
          </vitamui-slide-toggle>
        </div>
      </div>
    </div>

    <vitamui-select
      class="d-block"
      formControlName="status"
      [placeholder]="'PROFILE.POP_UP_CREATION_NOTICE.SAVE_AS_ACTIVE_OR_INACTIVE' | translate"
      [options]="statusOptions"
      [enableSearch]="false"
    ></vitamui-select>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button type="submit" [disabled]="!isFormValid()" class="btn primary">
      {{ data.okLabel }}
    </button>
    <button type="button" class="btn cancel link" (click)="onCancel()">{{ data.cancelLabel }}</button>
  </mat-dialog-actions>
</form>
