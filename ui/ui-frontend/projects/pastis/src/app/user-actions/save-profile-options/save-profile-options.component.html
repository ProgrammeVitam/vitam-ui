<vitamui-dialog-header [subhead]="data.subTitleDialog" [title]="data.titleDialog"></vitamui-dialog-header>

<mat-dialog-content class="gap-5">
  <pastis-generic-popup
    [firstChoice]="firstChoiceEnregistrement"
    [secondChoice]="secondChoiceEnregistrement"
    [title]="titleEnregistrement"
    (changeStatusEvent)="changeStatus($event)"
  >
  </pastis-generic-popup>

  <pastis-generic-popup
    *ngIf="valueSelected && !editProfile"
    [secondPopup]="true"
    [firstChoice]="firstChoiceGestionNotice"
    [secondChoice]="secondChoiceGestionNotice"
    [title]="titleGestionNotice"
    (changeStatusEvent)="changeStatusGestionNoticeProfil($event)"
  >
  </pastis-generic-popup>
</mat-dialog-content>

<mat-dialog-actions>
  <button type="submit" class="btn primary" (click)="onYesClick()">{{ data.okLabel }}</button>
  <button type="button" class="btn cancel link" (click)="onCancel()">{{ data.cancelLabel }}</button>
</mat-dialog-actions>
