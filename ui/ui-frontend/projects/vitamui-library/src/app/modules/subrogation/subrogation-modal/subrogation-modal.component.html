<vitamui-dialog-header
  [stepper]="stepper"
  [subhead]="'ARCHIVE_UNIT.DIALOGS.CANCEL.TITLE' | translate"
  [title]="[
    'SUBROGATION.HOME.RESULTS_TABLE.MODAL.TITLE' | translate,
    'SUBROGATION.HOME.RESULTS_TABLE.MODAL.WAITING_ACCEPTATION' | translate,
  ]"
></vitamui-dialog-header>

<vitamui-common-stepper #stepper [selectedIndex]="stepIndex" (selectionChange)="stepIndex = $event.selectedIndex">
  <cdk-step>
    <mat-dialog-content>
      <form [formGroup]="form">
        <div class="d-flex">
          <vitamui-common-input
            formControlName="emailFirstPart"
            [placeholder]="'SUBROGATION.HOME.RESULTS_TABLE.MODAL.MAIL' | translate"
            required
          >
            <ng-container *ngIf="form.get('emailFirstPart')?.touched">
              <vitamui-common-input-error *ngIf="form?.get('emailFirstPart')?.hasError('required')">{{
                'COMMON.REQUIRED' | translate
              }}</vitamui-common-input-error>
            </ng-container>
          </vitamui-common-input>

          <h4 class="mx-2 mt-1 light">&#64;</h4>

          <vitamui-select formControlName="domain" [options]="domains" [multiple]="false" [enableSearch]="false"></vitamui-select>
        </div>
      </form>
    </mat-dialog-content>

    <mat-dialog-actions>
      <button class="btn primary" appStepperNext (click)="askForSubrogation()" [disabled]="form.invalid">
        {{ 'SUBROGATION.HOME.RESULTS_TABLE.MODAL.BUTTON' | translate }}
      </button>
      <button class="btn cancel link" (click)="onCancel()">{{ 'COMMON.UNDO' | translate }}</button>
    </mat-dialog-actions>
  </cdk-step>

  <cdk-step>
    <mat-dialog-content>
      <div class="text normal" *ngIf="user?.firstname && user?.lastname">
        {{ 'SUBROGATION.HOME.RESULTS_TABLE.MODAL.ASK_SUBROGATION' | translate }} {{ user?.firstname }} {{ user?.lastname }}
      </div>

      <div class="text normal" *ngIf="!user?.firstname || !user?.lastname">
        {{ 'SUBROGATION.HOME.RESULTS_TABLE.MODAL.ASK_SUBROGATION' | translate }} {{ user?.email }}
      </div>

      <div class="d-flex justify-content-center align-items-center my-5">
        <mat-spinner *ngIf="pending" class="vitamui-spinner large"></mat-spinner>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions>
      <button type="button" class="btn cancel link" (click)="cancelSubrogation()">{{ 'COMMON.UNDO' | translate }}</button>
    </mat-dialog-actions>
  </cdk-step>
</vitamui-common-stepper>
