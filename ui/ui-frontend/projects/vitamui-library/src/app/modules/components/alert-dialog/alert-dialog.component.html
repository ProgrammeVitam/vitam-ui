<vitamui-dialog-header [subhead]="data.title | translate"></vitamui-dialog-header>

<mat-dialog-content>
  <div class="d-flex align-items-start danger">
    <div class="icon-container mr-2">
      <i class="vitamui-icon vitamui-icon-close"></i>
    </div>
    <div class="d-flex flex-column">
      <h5 class="mb-2 text bold danger">{{ data.title | translate }}</h5>
      <div class="text normal bold">{{ data.title | translate }}</div>
      <div class="text normal">{{ data.message | translate }}</div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button class="btn primary" [matDialogClose]="true">
    {{ data.cancelLabel | translate }}
  </button>
</mat-dialog-actions>
