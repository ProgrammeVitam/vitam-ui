<div class="collapse-title" (click)="toggle()">
  <i class="material-icons collapse-icon rotate-180" [class.collapsed]="collapseState === 'collapsed'">keyboard_arrow_down</i>
  {{ collapseTitle }}
</div>
<div class="collapse-content" [class.collapsed]="collapseState === 'collapsed'" [class.expanded]="collapseState === 'expanded'">
  <ng-content></ng-content>
</div>
