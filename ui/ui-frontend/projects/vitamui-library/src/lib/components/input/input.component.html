<div class="form-field">
  <div
    *ngFor="let item of items; trackBy: trackBy; let i = index; let first = first; let last = last"
    class="item"
    [class.first]="first"
    [class.vitamui-focused]="i === focused"
  >
    <div class="vitamui-input" [class.first]="first">
      <label *ngIf="first">
        {{ placeholder }}
        <span *ngIf="control.hasValidator(Validators.required)" class="required-marker">*</span>
      </label>

      <input
        *ngIf="!textarea"
        type="text"
        (blur)="onBlur(i)"
        (focus)="onFocus(i)"
        [ngModel]="item.value"
        (ngModelChange)="onValueChange($event, i)"
        [disabled]="disabled"
      />
      <div *ngIf="textarea" class="grow-wrap" [attr.data-replicated-value]="item.value">
        <textarea
          rows="3"
          (blur)="onBlur(i)"
          (focus)="onFocus(i)"
          [ngModel]="item.value"
          (ngModelChange)="onValueChange($event, i)"
          onInput="parentNode.dataset.replicatedValue = value"
          [disabled]="disabled"
        ></textarea>
      </div>

      <div *ngIf="!disabled && multiple" [class.hgap-1]="!textarea" [class.gap-1]="textarea">
        <button
          *ngIf="items.length > 1"
          type="button"
          class="btn btn-circle link primary xsmall remove"
          (click)="removeInput(i)"
          [vitamuiTooltip]="removeTooltipKey | translate"
          vitamuiTooltipPosition="LEFT"
          [outline]="true"
        >
          <i class="vitamui-icon vitamui-icon-remove"></i>
        </button>
        <button
          *ngIf="last && (i === focused || !isEmpty(item.value))"
          type="button"
          class="btn btn-circle link primary xsmall"
          (click)="addInput()"
          [disabled]="isEmpty(item.value)"
          [vitamuiTooltip]="addTooltipKey | translate"
          vitamuiTooltipPosition="LEFT"
          [outline]="true"
        >
          <i class="material-icons vitamui-icon vitamui-icon-add"> </i>
        </button>
      </div>
    </div>
  </div>
  <mat-spinner diameter="25"></mat-spinner>
</div>

<vitamui-form-errors [control]="control" [errorMessageMap]="errorMessageMap"></vitamui-form-errors>
