<div class="text-right">
  <button class="btn-circle" (click)="toggleShow()">
    <i class="material-icons rotate-180" [class.collapsed]="!isShown" [class.expanded]="isShown">keyboard_arrow_down</i>
  </button>
</div>

@if (isShown) {
  @for (event of events; track event) {
    <app-vitam-event-display [event]="event"></app-vitam-event-display>
  }
}
