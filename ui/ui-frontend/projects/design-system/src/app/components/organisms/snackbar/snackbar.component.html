<h2>Snackbar</h2>
<div class="gap-5">
  <div class="gap-3">
    <div class="hgap-3">
      <vitamui-select
        placeholder="Icon"
        [formField]="form.icon"
        [options]="iconOptions"
        [multiple]="false"
        [enableSearch]="false"
      ></vitamui-select>
      <vitamui-input placeholder="Message" [formField]="form.message"></vitamui-input>
    </div>
    <div>
      @for (button of form.buttons; track $index; let i = $index) {
        <h3>Button #{{ i + 1 }}</h3>
        <div class="hgap-3">
          <vitamui-input placeholder="Label" [formField]="button.label"></vitamui-input>
          <vitamui-input placeholder="Url" [formField]="button.url"></vitamui-input>
          <vitamui-slide-toggle [formField]="button.outline">Outline</vitamui-slide-toggle>
          <button type="button" class="btn secondary" (click)="removeButton(i)">Remove button</button>
        </div>
      }
    </div>
  </div>
  <button type="button" class="btn primary" (click)="addButton()">Add button</button>
</div>
