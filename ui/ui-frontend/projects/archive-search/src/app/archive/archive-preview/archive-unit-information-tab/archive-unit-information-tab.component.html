<div class="gap-2 align-items-stretch">
  <vitamui-common-data [label]="'ARCHIVE_SEARCH.ARCHIVE_UNIT_PREVIEW.FIELDS.NAME' | translate" [value]="archiveUnit | unitI18n: 'Title'" />

  <vitamui-common-data [label]="'ARCHIVE_SEARCH.ARCHIVE_UNIT_PREVIEW.FIELDS.GUID' | translate" [value]="archiveUnit['#opi']" />

  <vitamui-common-data [label]="'ARCHIVE_SEARCH.ARCHIVE_UNIT_PREVIEW.FIELDS.UAID' | translate" [value]="archiveUnit['#id']" />

  <vitamui-common-data
    [label]="'ARCHIVE_SEARCH.ARCHIVE_UNIT_PREVIEW.FIELDS.DESCRIPTION' | translate"
    [value]="archiveUnit | unitI18n: 'Description'"
  />

  <div class="hgap-4 align-items-baseline">
    <vitamui-common-data
      class="w-50"
      [label]="'ARCHIVE_SEARCH.ARCHIVE_UNIT_PREVIEW.FIELDS.SP' | translate"
      [value]="archiveUnit['#originating_agency']"
    />
    <vitamui-common-data
      class="w-50"
      [label]="'ARCHIVE_SEARCH.ARCHIVE_UNIT_PREVIEW.FIELDS.SP_LABEL' | translate"
      [value]="archiveUnit?.originating_agencyName"
    />
  </div>

  <div class="hgap-4 align-items-baseline">
    <vitamui-common-data class="w-50" [value]="fullPath ? (uaPath$ | async)?.fullPath : (uaPath$ | async)?.resumePath">
      <ng-template #label>
        {{ 'ARCHIVE_SEARCH.ARCHIVE_UNIT_PREVIEW.FIELDS.PATH' | translate }}
        <button class="ml-2 btn-show-full-path" type="button" (click)="showArchiveUniteFullPath()">
          {{ 'ARCHIVE_SEARCH.ARCHIVE_UNIT_PREVIEW.FIELDS.BTN_SHOW_COMPLETE_PATH' | translate }}
        </button>
      </ng-template>
    </vitamui-common-data>
    <vitamui-common-data
      class="w-50"
      [label]="'ARCHIVE_SEARCH.ARCHIVE_UNIT_PREVIEW.FIELDS.DESCRIPTION_LEVEL' | translate"
      [value]="'UNIT_UPDATE.' + archiveUnit.DescriptionLevel.toUpperCase() | translate"
    />
  </div>

  <div class="hgap-4 align-items-baseline">
    <vitamui-common-data
      class="w-50"
      [label]="'ARCHIVE_SEARCH.ARCHIVE_UNIT_PREVIEW.FIELDS.START_DATE' | translate"
      [value]="archiveUnit?.StartDate | dateTime: 'dd/MM/yyyy'"
    />
    <vitamui-common-data
      class="w-50"
      [label]="'ARCHIVE_SEARCH.ARCHIVE_UNIT_PREVIEW.FIELDS.END_DATE' | translate"
      [value]="archiveUnit?.EndDate | dateTime: 'dd/MM/yyyy'"
    />
  </div>
</div>

<button
  class="btn primary download-btn"
  [disabled]="!hasDownloadDocumentRole || !downloadableVersionWithQualifier"
  (click)="onDownloadObjectFromUnit()"
>
  <span>{{ 'ARCHIVE_SEARCH.ARCHIVE_UNIT_PREVIEW.FIELDS.DOWNLOAD_DOC' | translate }}</span>
  <i class="vitamui-icon vitamui-icon-deposit"></i>
</button>
