<div class="container p-4 gap-4 align-items-stretch">
  <div class="gap-2 align-items-stretch">
    <label class="text bold normal primary uppercase">{{ 'RULES.FINAL_ACTION.TITLE' | translate }}</label>

    <vitamui-select
      class="w-100"
      [placeholder]="'RULES.FINAL_ACTION.TITLE' | translate"
      (change)="onChangeValue()"
      [(ngModel)]="rulePropertyName"
      [options]="
        ruleCategory === 'AppraisalRule'
          ? [
              { key: 'Keep', label: 'RULES.FINAL_ACTION.KEEP' | translate },
              { key: 'Destroy', label: 'RULES.FINAL_ACTION.ELIMINATION' | translate },
            ]
          : ruleCategory === 'StorageRule'
            ? [
                { key: 'RestrictAccess', label: 'RULES.FINAL_ACTION.RESTRICT_ACCESS' | translate },
                { key: 'Transfer', label: 'RULES.FINAL_ACTION.TRANSFER' | translate },
                { key: 'Copy', label: 'RULES.FINAL_ACTION.COPY' | translate },
              ]
            : []
      "
      [multiple]="false"
      [enableSearch]="false"
    ></vitamui-select>

    <div *ngIf="showText" class="row message-text-ok">
      <div class="col-1"><i class="material-icons">check_circle</i></div>
      <div class="col-11">
        {{ 'RULES.UA_CONTROL.UA_FINAL_ACTION_MESSAGE' | translate }}
      </div>
    </div>
  </div>

  <div class="d-flex hgap-4">
    <button type="button" (click)="onUpdateRuleProperty()" [disabled]="isValidValue" class="btn primary">
      {{ 'RULES.COMMON.CONTROL' | translate }}
    </button>
    <button type="button" (click)="onCancelAddRuleProperty()" [disabled]="isCancelAddRulePropertyButtonDisabled" class="btn link cancel">
      {{ 'RULES.COMMON.UNDO' | translate }}
    </button>
  </div>
</div>

<ng-template #confirmDeleteAddRulePropertyDialog>
  <vitamui-dialog-header [title]="'RULES.DIALOG_MESSAGE.DELETE_COMPONENT' | translate"></vitamui-dialog-header>
  <mat-dialog-actions>
    <button [matDialogClose]="true" class="btn primary btn-confirm-dialog">{{ 'RULES.COMMON.CONFIRM' | translate }}</button>
    <button matDialogClose class="btn cancel link">{{ 'RULES.COMMON.UNDO' | translate }}</button>
  </mat-dialog-actions>
</ng-template>
