<mat-sidenav-container [autosize]="true" [hasBackdrop]="false">
  <mat-sidenav-content>
    <div class="vitamui-heading">
      <vitamui-common-title-breadcrumb>
        <h5>{{ 'ARCHIVE_SEARCH.RULES_ACTION.UPDATE_RULE' | translate }}</h5>
      </vitamui-common-title-breadcrumb>
    </div>

    <div class="vitamui-content">
      <div class="row">
        <div class="col-4 radio-btn-area py-3 gap-5 align-items-stretch">
          <div class="gap-3 align-items-stretch">
            <label class="text bold normal primary"> {{ 'RULES.SELECT_RULE_CATEGORY' | translate }} *</label>
            <div class="radio-group" *ngFor="let ruleCategory of rulesCategories">
              <div class="radio-btn-list d-flex align-items-center">
                <mat-radio-button (change)="selectRule(ruleCategory)" [disabled]="ruleCategory.isDisabled" [value]="ruleCategory.id">
                  {{ ruleCategory.name }}
                </mat-radio-button>
              </div>
            </div>
          </div>

          <div class="gap-3 align-items-stretch">
            <label class="text bold normal primary">{{ 'RULES.SELECT_RULE_ACTION' | translate }} *</label>
            <vitamui-select
              #action
              [placeholder]="'RULES.ACTION_ON_RULES' | translate"
              [disabled]="!isRuleCategorySelected || !isAllActionsValid()"
              [options]="actionOptions"
              [multiple]="false"
              [enableSearch]="false"
              (change)="onSelectAction($event); reset(action)"
            ></vitamui-select>
            <vitamui-select
              #otherAction
              [placeholder]="'RULES.OTHER_ACTIONS' | translate"
              [disabled]="!isRuleCategorySelected || !isAllActionsValid()"
              [options]="otherActionOptions"
              [multiple]="false"
              [enableSearch]="false"
              (change)="onSelectAction($event); reset(otherAction)"
            ></vitamui-select>
          </div>
        </div>
        <div class="col-8 row-padding">
          <div class="update-rules-table-head row">
            <div class="col-2 clickable" (click)="returnToArchiveSearchPage()">
              <span class="text primary"> {{ 'RULES.BACK' | translate }}</span>
            </div>
            <div class="col-10">
              <div class="row">
                <div class="col-7">
                  <span class="details-ua">
                    {{ 'RULES.UA_SELECTED' | translate: { ua_selected: selectedItemToShow } }}
                  </span>
                </div>
                <div class="col-5">
                  <button class="btn primary" [disabled]="ruleActionsAbsentOrInvalid()" (click)="submitUpdates()">
                    {{ 'RULES.EXECUTE_RULE_UPDATE' | translate }}
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-12">
              <mat-tab-group [selectedIndex]="indexOfSelectedCategory">
                <div *ngFor="let item of rulesCategoriesToShow">
                  <mat-tab label="{{ item.name }}">
                    <app-archive-unit-rules
                      [selectedItem]="selectedItem"
                      [ruleCategory]="item.id"
                      [hasExactCount]="hasExactCount"
                      [rules$]="rules$"
                    ></app-archive-unit-rules>
                  </mat-tab>
                </div>
              </mat-tab-group>
            </div>
          </div>
        </div>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

<ng-template #confirmRuleActionsDialog>
  <vitamui-dialog-header
    [subhead]="'RULES.DIALOG_MESSAGE.UPDATE_CONFIRM_TITLE_MESSAGE' | translate"
    [title]="'RULES.DIALOG_MESSAGE.UPDATE_CONFIRM_MESSAGE' | translate"
  ></vitamui-dialog-header>
  <mat-dialog-actions>
    <button matDialogClose class="btn primary btn-confirm-dialog">{{ 'RULES.COMMON.UNDO' | translate }}</button>
    <button [matDialogClose]="true" class="btn cancel link">{{ 'RULES.COMMON.CONFIRM' | translate }}</button>
  </mat-dialog-actions>
</ng-template>

<ng-template #confirmLeaveRuleActionsDialog>
  <vitamui-dialog-header
    [title]="'RULES.DIALOG_MESSAGE.EXIT_CONFIRM_MESSAGE' | translate: { ua_selected: selectedItem }"
  ></vitamui-dialog-header>
  <mat-dialog-actions>
    <button [matDialogClose]="true" class="btn primary btn-confirm-dialog">{{ 'RULES.COMMON.CONFIRM' | translate }}</button>
    <button matDialogClose class="btn cancel link">{{ 'RULES.COMMON.UNDO' | translate }}</button>
  </mat-dialog-actions>
</ng-template>
