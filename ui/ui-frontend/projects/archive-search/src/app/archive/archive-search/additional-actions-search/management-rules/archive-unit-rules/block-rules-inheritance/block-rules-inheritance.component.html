<div class="container p-4">
  <form [formGroup]="ruleDetailsForm" class="gap-4 align-items-stretch">
    <div class="gap-2 align-items-stretch">
      <label class="text bold normal primary uppercase"> {{ 'RULES.SOURCE_MANAGEMENT_RULE' | translate }}</label>
      <div class="row content vitamui-form">
        <vitamui-select
          class="col"
          formControlName="rule"
          [options]="ruleOptions"
          [placeholder]="'RULES.MANAGEMENT_RULE' | translate"
          [searchBarPlaceHolder]="'ARCHIVE_SEARCH.SEARCH_CRITERIA_FILTER.FIELDS.PLACEHOLDER_SEARCHBAR_CHOOSE_MANAGEMENT_RULE' | translate"
        ></vitamui-select>
      </div>
    </div>

    @if (showText) {
      <div class="row message-text-ok">
        <div class="col-1"><i class="material-icons">check_circle</i></div>
        <div class="col-11">
          {{ 'RULES.UA_CONTROL.UA_FINAL_ACTION_MESSAGE' | translate }}
        </div>
      </div>
    }

    <div class="d-flex">
      <button
        type="submit"
        class="btn primary mr-4"
        [disabled]="disabledControl || !ruleDetailsForm.valid"
        (click)="blockRuleInheritance()"
      >
        {{ 'RULES.COMMON.CONTROL' | translate }}
      </button>
      <button type="button" class="btn link cancel" (click)="onDelete()">{{ 'RULES.COMMON.UNDO' | translate }}</button>
    </div>
  </form>
</div>

<ng-template #confirmDeleteBlockBlocRuleDialog>
  <vitamui-dialog-header [title]="'RULES.DIALOG_MESSAGE.DELETE_COMPONENT' | translate"></vitamui-dialog-header>
  <mat-dialog-actions>
    <button [matDialogClose]="true" class="btn primary btn-confirm-dialog">{{ 'RULES.COMMON.CONFIRM' | translate }}</button>
    <button matDialogClose class="btn cancel link">{{ 'RULES.COMMON.UNDO' | translate }}</button>
  </mat-dialog-actions>
</ng-template>
