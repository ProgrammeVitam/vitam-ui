<form [formGroup]="form" class="gap-5" (ngSubmit)="onSubmit()">
  <div class="gap-3 align-items-stretch w-100">
    <vitamui-common-slide-toggle [formControl]="statusControl" checked="form.controls.status.value === 'ACTIVE'">
      {{ 'CONTEXTS_APP.TAB.INFORMATION.STATUS_TOGGLE' | translate }}
    </vitamui-common-slide-toggle>

    <vitamui-common-slide-toggle formControlName="enableControl">
      {{ 'CONTEXTS_APP.TAB.INFORMATION.TENANT_TOGGLE' | translate }}
    </vitamui-common-slide-toggle>

    <vitamui-common-input class="w-100" formControlName="name" [placeholder]="'CONTEXTS_APP.TAB.INFORMATION.NAME' | translate" disabled>
    </vitamui-common-input>

    <vitamui-select
      formControlName="securityProfile"
      [placeholder]="'CONTEXTS_APP.TAB.INFORMATION.SECURITY_PROFILE' | translate"
      [options]="securityProfiles"
      [enableSearch]="false"
    ></vitamui-select>

    <vitamui-common-multiple-options-datepicker
      class="w-100"
      formControlName="creationDate"
      [label]="'CONTEXTS_APP.TAB.INFORMATION.CREATION_DATE' | translate"
    >
    </vitamui-common-multiple-options-datepicker>

    <vitamui-common-multiple-options-datepicker
      class="w-100"
      formControlName="lastUpdate"
      [label]="'CONTEXTS_APP.TAB.INFORMATION.LAST_UPDATE_DATE' | translate"
    >
    </vitamui-common-multiple-options-datepicker>

    <vitamui-common-multiple-options-datepicker
      class="w-100"
      formControlName="activationDate"
      [label]="'CONTEXTS_APP.TAB.INFORMATION.ACTIVATION_DATE' | translate"
    >
    </vitamui-common-multiple-options-datepicker>

    <vitamui-common-multiple-options-datepicker
      class="w-100"
      formControlName="deactivationDate"
      [label]="'CONTEXTS_APP.TAB.INFORMATION.DEACTIVATION_DATE' | translate"
    >
    </vitamui-common-multiple-options-datepicker>
  </div>

  <button type="submit" class="btn primary" [disabled]="isInvalid() || unchanged() || submited">
    {{ 'COMMON.SAVE' | translate }}
  </button>
</form>
