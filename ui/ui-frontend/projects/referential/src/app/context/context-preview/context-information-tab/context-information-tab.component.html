<form [formRoot]="form" class="gap-5">
  <div class="gap-3 align-items-stretch w-100">
    <vitamui-slide-toggle [checked]="form.status().value() === 'ACTIVE'" (checkedChange)="onStatusChange($event)">
      {{ 'CONTEXTS_APP.TAB.INFORMATION.STATUS_TOGGLE' | translate }}
    </vitamui-slide-toggle>

    <vitamui-slide-toggle [formField]="form.enableControl">
      {{ 'CONTEXTS_APP.TAB.INFORMATION.TENANT_TOGGLE' | translate }}
    </vitamui-slide-toggle>

    <vitamui-input
      class="w-100"
      [formField]="form.name"
      [placeholder]="'CONTEXTS_APP.TAB.INFORMATION.NAME' | translate"
      [errorMessageMap]="{
        nameExists: 'CONTEXTS_APP.CREATE_DIALOG.INFORMATION.NAME_ALREADY_EXISTS' | translate,
        incorrectName: 'CONTEXTS_APP.CREATE_DIALOG.INFORMATION.INCORRECT_NAME' | translate,
      }"
    >
    </vitamui-input>

    <vitamui-select
      [formField]="form.securityProfile"
      [placeholder]="'CONTEXTS_APP.TAB.INFORMATION.SECURITY_PROFILE' | translate"
      [options]="securityProfiles"
      [enableSearch]="false"
    ></vitamui-select>

    <vitamui-datepicker class="w-100" [formField]="form.creationDate" [label]="'CONTEXTS_APP.TAB.INFORMATION.CREATION_DATE' | translate">
    </vitamui-datepicker>

    <vitamui-datepicker class="w-100" [formField]="form.lastUpdate" [label]="'CONTEXTS_APP.TAB.INFORMATION.LAST_UPDATE_DATE' | translate">
    </vitamui-datepicker>

    <vitamui-datepicker
      class="w-100"
      [formField]="form.activationDate"
      [label]="'CONTEXTS_APP.TAB.INFORMATION.ACTIVATION_DATE' | translate"
    >
    </vitamui-datepicker>

    <vitamui-datepicker
      class="w-100"
      [formField]="form.deactivationDate"
      [label]="'CONTEXTS_APP.TAB.INFORMATION.DEACTIVATION_DATE' | translate"
    >
    </vitamui-datepicker>
  </div>

  <button type="submit" class="btn primary" [disabled]="isInvalid() || unchanged() || submitted()">
    {{ 'COMMON.SAVE' | translate }}
  </button>
</form>
