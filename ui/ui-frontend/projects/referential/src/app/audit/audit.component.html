<mat-sidenav-container [autosize]="true" [hasBackdrop]="false">
  <mat-sidenav #panel mode="side" position="end" [fixedInViewport]="true">
    <app-audit-preview *ngIf="openedItem" [audit]="openedItem" (previewClose)="closePanel()"></app-audit-preview>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="vitamui-heading">
      <vitamui-common-title-breadcrumb>
        <h5>{{ 'AUDIT.HOME.TITLE' | translate }}</h5>
      </vitamui-common-title-breadcrumb>

      <vitamui-common-banner [searchbarPlaceholder]="'AUDIT.HOME.SEARCH_PLACEHOLDER' | translate" (search)="onSearchSubmit($event)">
        <button class="btn primary mr-3" (click)="openCreateAuditDialog()">
          <span>{{ 'AUDIT.HOME.START_AUDIT' | translate }}</span>
        </button>
      </vitamui-common-banner>

      <form [formGroup]="dateRangeFilterForm" class="d-flex align-items-center mt-4 px-2 hgap-3">
        <vitamui-common-multiple-options-datepicker
          formControlName="startDate"
          [label]="'AUDIT.HOME.START_DATE' | translate"
          [max]="dateRangeFilterForm.get('endDate')?.value"
        ></vitamui-common-multiple-options-datepicker>
        <vitamui-common-multiple-options-datepicker
          formControlName="endDate"
          [label]="'AUDIT.HOME.END_DATE' | translate"
          [min]="dateRangeFilterForm.get('startDate')?.value"
        ></vitamui-common-multiple-options-datepicker>
      </form>
    </div>

    <div class="vitamui-content">
      <app-audit-list (auditClick)="showAudit($event)" [search]="search" [filters]="filters"></app-audit-list>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
