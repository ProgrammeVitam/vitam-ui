<vitamui-dialog-header [title]="'ACCESS_CONTRACT.UPDATE_NODE_DIALOG.TITLE' | translate"></vitamui-dialog-header>

<form [formGroup]="selectNodesForm" (ngSubmit)="updateAccessContractNodes()">
  <mat-dialog-content>
    <vitamui-slide-toggle class="mt-3" [formControl]="allRootUnitsControl">
      <div class="d-flex align-items-center">
        <span>{{ 'ACCESS_CONTRACT.CREATE_DIALOG.ALL_POSITIONS' | translate }}</span>

        <i
          class="vitamui-icon vitamui-icon-info text large primary ml-3"
          vitamuiTooltip="{{ 'ACCESS_CONTRACT.UPDATE_NODE_DIALOG.ALL_POSITIONS_INFO' | translate }}"
          vitamuiTooltipPosition="BOTTOM"
        >
        </i>
      </div>
    </vitamui-slide-toggle>

    <vitamui-library-filing-plan
      *ngIf="!allRootUnitsControl.value"
      [formControl]="selectedRootsControl"
      [tenantIdentifier]="tenantIdentifier"
      [mode]="FILLING_PLAN_MODE_BOTH"
    >
    </vitamui-library-filing-plan>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button type="submit" class="btn primary" [disabled]="isInvalid()">
      {{ 'COMMON.VALIDATE' | translate }}
    </button>
    <button type="button" class="btn cancel link" (click)="onCancel()">
      {{ 'COMMON.UNDO' | translate }}
    </button>
  </mat-dialog-actions>
</form>
