<form [formGroup]="form" (ngSubmit)="onSubmit()" class="gap-5">
  <div class="gap-3 w-100">
    <vitamui-common-slide-toggle class="w-100" [formControl]="statusControl">
      <span>{{ 'ACCESS_CONTRACT.TAB.INFORMATION.ACTIVE_CONTRACT' | translate }}</span>
    </vitamui-common-slide-toggle>

    <vitamui-input
      formControlName="name"
      class="w-100"
      [placeholder]="'ACCESS_CONTRACT.TAB.INFORMATION.NAME' | translate"
      [errorMessageMap]="{ nameExists: 'COMMON.NAME_ALREADY_EXISTS' | translate }"
    >
    </vitamui-input>

    <vitamui-input
      class="w-100"
      formControlName="description"
      [placeholder]="'ACCESS_CONTRACT.TAB.INFORMATION.DESCRIPTION' | translate"
      [textarea]="true"
    >
    </vitamui-input>

    <vitamui-common-slide-toggle class="w-100" [formControl]="accessLogControl">
      <span>{{ 'ACCESS_CONTRACT.TAB.INFORMATION.ACCESS_LOGS' | translate }}</span>
    </vitamui-common-slide-toggle>

    <vitamui-input
      class="w-100"
      [placeholder]="'ACCESS_CONTRACT.TAB.INFORMATION.CREATION_DATE' | translate"
      [ngModel]="accessContract?.creationDate | dateTime: 'dd/MM/yyyy'"
      [ngModelOptions]="{ standalone: true }"
      disabled
    >
    </vitamui-input>

    <vitamui-input
      class="w-100"
      [placeholder]="'ACCESS_CONTRACT.TAB.INFORMATION.LAST_MODIFICATION_DATE' | translate"
      [ngModel]="accessContract?.lastUpdate | dateTime: 'dd/MM/yyyy'"
      [ngModelOptions]="{ standalone: true }"
      disabled
    >
    </vitamui-input>

    <vitamui-input
      class="w-100"
      [placeholder]="'ACCESS_CONTRACT.TAB.INFORMATION.ACTIVATION_DATE' | translate"
      [ngModel]="
        accessContract?.status === 'ACTIVE' && accessContract?.activationDate
          ? (accessContract.activationDate | dateTime: 'dd/MM/yyyy')
          : '-'
      "
      [ngModelOptions]="{ standalone: true }"
      disabled
    >
    </vitamui-input>

    <vitamui-input
      class="w-100"
      [placeholder]="'ACCESS_CONTRACT.TAB.INFORMATION.DEACTIVATION_DATE' | translate"
      [ngModel]="accessContract?.deactivationDate ? (accessContract.deactivationDate | dateTime: 'dd/MM/yyyy') : '-'"
      [ngModelOptions]="{ standalone: true }"
      disabled
    >
    </vitamui-input>
  </div>

  <button type="submit" class="btn primary" [disabled]="isInvalid() || unChanged || submitted">
    {{ 'COMMON.SAVE' | translate }}
  </button>
</form>
