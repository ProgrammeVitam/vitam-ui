<form [formRoot]="form" class="gap-5">
  <div class="gap-3 w-100">
    <vitamui-slide-toggle class="w-100" [checked]="form.status().value() === 'ACTIVE'" (checkedChange)="onStatusChange($event)">
      <span>{{ 'ACCESS_CONTRACT.TAB.INFORMATION.ACTIVE_CONTRACT' | translate }}</span>
    </vitamui-slide-toggle>

    <vitamui-input
      [formField]="form.name"
      class="w-100"
      [placeholder]="'ACCESS_CONTRACT.TAB.INFORMATION.NAME' | translate"
      [errorMessageMap]="{ nameExists: 'COMMON.NAME_ALREADY_EXISTS' | translate }"
    >
    </vitamui-input>

    <vitamui-input
      class="w-100"
      [formField]="form.description"
      [placeholder]="'ACCESS_CONTRACT.TAB.INFORMATION.DESCRIPTION' | translate"
      [textarea]="true"
    >
    </vitamui-input>

    <vitamui-slide-toggle class="w-100" [checked]="form.accessLog().value() === 'ACTIVE'" (checkedChange)="onAccessLogChange($event)">
      <span>{{ 'ACCESS_CONTRACT.TAB.INFORMATION.ACCESS_LOGS' | translate }}</span>
    </vitamui-slide-toggle>

    <vitamui-input
      class="w-100"
      [placeholder]="'ACCESS_CONTRACT.TAB.INFORMATION.CREATION_DATE' | translate"
      [formField]="datesForm.creationDate"
    >
    </vitamui-input>

    <vitamui-input
      class="w-100"
      [placeholder]="'ACCESS_CONTRACT.TAB.INFORMATION.LAST_MODIFICATION_DATE' | translate"
      [formField]="datesForm.lastUpdate"
    >
    </vitamui-input>

    <vitamui-input
      class="w-100"
      [placeholder]="'ACCESS_CONTRACT.TAB.INFORMATION.ACTIVATION_DATE' | translate"
      [formField]="datesForm.activationDate"
    >
    </vitamui-input>

    <vitamui-input
      class="w-100"
      [placeholder]="'ACCESS_CONTRACT.TAB.INFORMATION.DEACTIVATION_DATE' | translate"
      [formField]="datesForm.deactivationDate"
    >
    </vitamui-input>
  </div>

  <button type="submit" class="btn primary" [disabled]="isInvalid() || unChanged || submitted">
    {{ 'COMMON.SAVE' | translate }}
  </button>
</form>
