<mat-sidenav-container [autosize]="true" [hasBackdrop]="false">
  <mat-sidenav [class]="'mat-sidenav'" [ngClass]="'extended-lateral-panel'" #panel mode="side" position="end" [fixedInViewport]="true">
    @if (openedItem) {
      <app-accession-register-preview (previewClose)="closePanel()" [accessionRegisterDetail]="openedItem"></app-accession-register-preview>
    }
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="vitamui-heading">
      <vitamui-title-breadcrumb>
        <h5>{{ 'ACCESSION_REGISTER.ACCESSION_REGISTER' | translate }}</h5>
      </vitamui-title-breadcrumb>

      <vitamui-banner
        [searchbarPlaceholder]="'ACCESSION_REGISTER.SEARCH_BAR_PLACEHOLDER' | translate"
        (search)="onSearchSubmit()"
        (searchChanged)="onSearchTextChanged($event)"
      >
        <button class="btn primary ml-5" (click)="onSearchSubmit()">
          <span>{{ 'ACCESSION_REGISTER.SEARCH_BAR_BUTTON_LABEL' | translate }}</span>
        </button>
        <div class="d-flex div-btn-delete ml-3">
          <button
            (click)="resetAdvancedSearch()"
            type="button"
            title="{{ 'ACCESSION_REGISTER.DELETE_BUTTON_HOVER_MESSAGE' | translate }}"
            class="btn btn-circle secondary large"
          >
            <i class="material-icons primary-save-icon">delete</i>
          </button>
          @if (isAdvancedFormChanged$ | async) {
            <strong class="ml-3">{{ 'ACCESSION_REGISTER.ADVANCED_SEARCH_FILTERS_ACTIVATED' | translate }}</strong>
          }
        </div>
      </vitamui-banner>

      <app-accession-register-advanced-search
        [ngClass]="{ 'hide-panel': (advancedSearchPanelOpenState$ | async) !== true }"
        (showAdvancedSearchPanel)="openAdvancedSearchPanel()"
      >
      </app-accession-register-advanced-search>
    </div>
    <div class="vitamui-content">
      <div>
        <app-accession-register-facets (showAdvancedSearchPanel)="openAdvancedSearchPanel()"></app-accession-register-facets>
      </div>
      <div class="mt-3">
        <app-accession-register-list
          [searchText]="search"
          (accessionRegisterClick)="accessionRegisterClick($event)"
          [accessContract]="accessContract"
        >
        </app-accession-register-list>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
