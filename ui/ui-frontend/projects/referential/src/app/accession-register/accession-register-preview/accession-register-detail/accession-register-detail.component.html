<div class="gap-2 align-items-stretch p-5">
  <div class="row p-0">
    <vitamui-common-data
      class="w-50"
      [label]="'ACCESSION_REGISTER.PREVIEW.DATE' | translate"
      [value]="accessionRegisterDetail.endDate | date: 'dd/MM/yyyy'"
    />
    <vitamui-common-data
      class="w-50"
      [label]="'ACCESSION_REGISTER.PREVIEW.ORIGINATING_AGENCY' | translate"
      [value]="formatReferentialValue(accessionRegisterDetail.originatingAgency, accessionRegisterDetail.originatingAgencyLabel)"
      [valueCss]="'text-ellipsis'"
      [valueTooltip]="accessionRegisterDetail.originatingAgencyLabel"
    />
  </div>
  <div class="row p-0">
    <vitamui-common-data
      class="w-50"
      [label]="'ACCESSION_REGISTER.PREVIEW.ARCHIVAL_AGREEMENT' | translate"
      [value]="formatReferentialValue(accessionRegisterDetail.archivalAgreement, accessionRegisterDetail.archivalAgreementLabel)"
      [valueCss]="'text-ellipsis'"
      [valueTooltip]="accessionRegisterDetail.archivalAgreementLabel"
    />
    <vitamui-common-data
      class="w-50"
      [label]="'ACCESSION_REGISTER.PREVIEW.ARCHIVAL_PROFILE' | translate"
      [value]="formatReferentialValue(accessionRegisterDetail.archivalProfile, accessionRegisterDetail.archivalProfileLabel)"
      [valueCss]="'text-ellipsis'"
      [valueTooltip]="accessionRegisterDetail.archivalProfileLabel"
    />
  </div>

  <div class="row p-0">
    <vitamui-common-data
      class="w-50"
      [label]="'ACCESSION_REGISTER.PREVIEW.ACQUISITION_INFORMATION' | translate"
      [value]="accessionRegisterDetail.acquisitionInformation"
    />
    <vitamui-common-data
      [vitamuiTooltipShowDelay]="300"
      [valueTooltip]="accessionRegisterDetail.originatingAgencyLabel"
      class="w-50"
      [label]="'ACCESSION_REGISTER.PREVIEW.STATUS' | translate"
      [value]="'ACCESSION_REGISTER.STATUS.' + accessionRegisterDetail.status | translate"
    />
  </div>
  <div class="row p-0">
    <vitamui-common-data
      class="w-50"
      [label]="'ACCESSION_REGISTER.PREVIEW.LEGAL_STATUS' | translate"
      [value]="accessionRegisterDetail.legalStatus"
    />
    <vitamui-common-data
      class="w-50"
      [label]="'ACCESSION_REGISTER.PREVIEW.SUBMISSION_AGENCY' | translate"
      [value]="formatReferentialValue(accessionRegisterDetail.submissionAgency, accessionRegisterDetail.submissionAgencyLabel)"
      [valueCss]="'text-ellipsis'"
      [valueTooltip]="accessionRegisterDetail.submissionAgencyLabel"
    />
  </div>
  <div class="row p-0">
    <vitamui-common-data
      class="w-50"
      [label]="'ACCESSION_REGISTER.PREVIEW.OPERATION_TECHNICAL_IDENTIFIER' | translate"
      [value]="accessionRegisterDetail.opi"
    />
  </div>
  <div class="d-flex p-0 col-12 read-only-field comment gap-1">
    <label>{{ 'ACCESSION_REGISTER.PREVIEW.COMMENTS' | translate }}</label>
    <div>
      <div class="word-break">{{ formatedComment() }}</div>
      @if (hasLongComment) {
        <div class="button">
          <button class="btn-circle" (click)="onClicShowMoreOrLessOfComment()">
            <i class="material-icons rotate-180" [class.collapsed]="!showFullComment" [class.expanded]="showFullComment"
              >keyboard_arrow_down</i
            >
          </button>
        </div>
      }
    </div>
  </div>
</div>
