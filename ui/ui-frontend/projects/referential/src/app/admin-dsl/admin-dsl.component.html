<mat-sidenav-container [autosize]="true" [hasBackdrop]="false">
  <mat-sidenav #panel mode="side" position="end" [fixedInViewport]="true"> </mat-sidenav>

  <mat-sidenav-content>
    <div class="vitamui-heading mb-3">
      <vitamui-common-title-breadcrumb>
        <h5>{{ 'DSL.HOME.TITLE' | translate }}</h5>
      </vitamui-common-title-breadcrumb>

      <form [formGroup]="form" (ngSubmit)="search()" class="d-flex align-item-center justify-content-between">
        <vitamui-select
          class="w-100"
          formControlName="dslQueryType"
          [placeholder]="'DSL.HOME.SEARCH_CATEGORY' | translate"
          [options]="dslQueryTypeOptions"
          [multiple]="false"
          [enableSearch]="false"
        ></vitamui-select>

        <vitamui-input
          class="w-100 mx-3"
          formControlName="id"
          [placeholder]="'DSL.HOME.IDENTIFIER' | translate"
          [required]="isUnitIdRequired()"
          [errorMessageMap]="{
            minlength: 'DSL.HOME.IDENTIFIER_LENGTH_ERROR' | translate: { length: form.get('id')?.errors?.minlength?.requiredLength },
            maxlength: 'DSL.HOME.IDENTIFIER_LENGTH_ERROR' | translate: { length: form.get('id')?.errors?.maxlength?.requiredLength },
            unknownUnit: 'DSL.HOME.UNKNOWN_UNIT' | translate,
          }"
        >
        </vitamui-input>

        <vitamui-select
          class="w-100"
          formControlName="accessContract"
          [placeholder]="'DSL.HOME.ACCESS_CONTRACT' | translate"
          [options]="accessContracts"
          [multiple]="false"
          [enableSearch]="false"
        ></vitamui-select>
      </form>
    </div>

    <div class="vitamui-content">
      <form [formGroup]="form" class="request">
        <div class="w-100 mr-3">
          <div class="text normal bold mb-3">{{ 'DSL.HOME.REQUEST' | translate }}</div>
          <vitamui-common-textarea class="w-100" formControlName="dsl"></vitamui-common-textarea>
        </div>

        <div class="w-100">
          <div class="text normal bold mb-3">{{ 'DSL.HOME.REQUEST_RESULT' | translate }}</div>
          <vitamui-common-textarea class="w-100" formControlName="response" disabled #responseText></vitamui-common-textarea>
        </div>
      </form>

      <div class="actions">
        <div>
          <button class="btn primary mr-3" (click)="search()" [disabled]="form.pending || form.invalid">
            {{ 'COMMON.SEARCH' | translate }}
          </button>
          <button class="btn secondary" (click)="checkDsl()">{{ 'DSL.HOME.VALIDATE_JSON' | translate }}</button>
        </div>
        <div>
          <button class="btn outline outline-primary mr-3" (click)="copyToClipbord(responseText.value)">
            {{ 'COMMON.COPY' | translate }}
          </button>

          <button class="btn outline outline-primary" (click)="clear()">{{ 'COMMON.DELETE' | translate }}</button>
        </div>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
