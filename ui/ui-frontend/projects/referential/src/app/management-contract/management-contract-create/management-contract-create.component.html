<vitamui-dialog-header
  [stepper]="stepper"
  [subhead]="'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.CREATION_ACTION' | translate"
  [title]="['CONTRACT_MANAGEMENT.CONTRACTS_CREATION.INFORMATIONS' | translate, '', '']"
></vitamui-dialog-header>

<form [formGroup]="form" (ngSubmit)="onSubmit()" (keydown.enter)="$event.preventDefault()">
  <vitamui-stepper #stepper>
    <!-- Step 1 -->
    <cdk-step>
      <mat-dialog-content>
        <div class="gap-4">
          <vitamui-slide-toggle class="w-100" formControlName="status">{{
            'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.CONTRACT_STATUS' | translate
          }}</vitamui-slide-toggle>
          <vitamui-input
            *ngIf="isSlaveMode"
            class="w-100"
            formControlName="identifier"
            [placeholder]="'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.IDENTIFIER' | translate"
            [errorMessageMap]="{ identifierExists: 'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.IDENTIFIER_ALREADY_EXIST' | translate }"
          >
          </vitamui-input>

          <vitamui-input
            class="w-100"
            formControlName="name"
            [placeholder]="'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.NAME' | translate"
            [errorMessageMap]="{ nameExists: 'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.NAME_ALREADY_EXIST' | translate }"
          >
          </vitamui-input>

          <vitamui-input
            [textarea]="true"
            class="w-100"
            formControlName="description"
            [placeholder]="'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.DESCRIPTION' | translate"
          >
          </vitamui-input>
        </div>
      </mat-dialog-content>

      <mat-dialog-actions>
        <vitamui-next-step [disabled]="firstStepInvalid()"></vitamui-next-step>
        <button type="button" class="btn cancel link" (click)="onCancel()">{{ 'COMMON.UNDO' | translate }}</button>
      </mat-dialog-actions>
    </cdk-step>

    <!-- Step 2 -->
    <cdk-step>
      <div class="subtitle">
        <span>{{ 'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.STORAGE_POLICIES' | translate }}</span>
        <i
          class="vitamui-icon vitamui-icon-info icon"
          [vitamuiTooltip]="'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.STORAGE_POLICIES_TOOLTIP' | translate"
        ></i>
      </div>

      <mat-dialog-content>
        <div class="gap-4" formGroupName="storage" style="width: 100%">
          <vitamui-input
            class="w-100"
            formControlName="unitStrategy"
            [placeholder]="'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.UNIT_STRATEGY' | translate"
          >
          </vitamui-input>
          <vitamui-input
            class="w-100"
            formControlName="objectGroupStrategy"
            placeholder=" {{ 'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.OBJECT_GROUP_STRATEGY' | translate }}"
          >
          </vitamui-input>
          <vitamui-input
            class="w-100"
            formControlName="objectStrategy"
            [placeholder]="'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.OBJECT_STRATEGY' | translate"
          >
          </vitamui-input>
        </div>
      </mat-dialog-content>

      <mat-dialog-actions>
        <div>
          <vitamui-next-step [disabled]="secondStepInvalid() || isDisabledButton"></vitamui-next-step>
          <button type="button" class="btn cancel link" [disabled]="isDisabledButton" (click)="onCancel()">
            {{ 'COMMON.UNDO' | translate }}
          </button>
        </div>
        <vitamui-previous-step></vitamui-previous-step>
      </mat-dialog-actions>
    </cdk-step>

    <!-- Step 3 -->
    <cdk-step>
      <div class="subtitle">
        <span>{{ 'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.PARAMETRAGE_IDENTIFICATION_PERENNE' | translate }}</span>
        <i
          class="vitamui-icon vitamui-icon-info icon"
          [vitamuiTooltip]="'CONTRACT_MANAGEMENT.CONTRACTS_CREATION.PARAMETRAGE_IDENTIFICATION_PERENNE_TOOLTIP' | translate"
        ></i>
      </div>

      <mat-dialog-content>
        <vitamui-select
          class="w-100"
          formControlName="policyTypeOption"
          [placeholder]="'CONTRACT_MANAGEMENT.FORM_UPDATE.CHOOSE_IDENTIFIER_TYPE' | translate"
          [options]="policyTypeOptions"
          [multiple]="false"
          [enableSearch]="false"
        ></vitamui-select>

        <div class="mt-3" formArrayName="persistentIdentifierPolicies">
          <div *ngFor="let persistentIdentifier of getPersistentIdentifierPolicies().controls">
            <app-create-persistent-identifier-policy-form
              [form]="persistentIdentifier"
              (objectUsagePolicyAdded)="form.markAsDirty()"
              (objectUsagePolicyRemoved)="form.markAsDirty()"
            ></app-create-persistent-identifier-policy-form>
          </div>
        </div>
      </mat-dialog-content>

      <mat-dialog-actions>
        <div>
          <button type="submit" class="btn primary" [disabled]="!hasValidPersistentIdentifierPolicies() || isDisabledButton">
            {{ 'COMMON.SUBMIT' | translate }}
          </button>
          <button type="button" class="btn cancel link" [disabled]="isDisabledButton" (click)="onCancel()">
            {{ 'COMMON.UNDO' | translate }}
          </button>
        </div>
        <vitamui-previous-step></vitamui-previous-step>
      </mat-dialog-actions>
    </cdk-step>
  </vitamui-stepper>
</form>
