<form [formRoot]="form" class="gap-5">
  <div class="gap-3 w-100">
    <vitamui-input class="w-100" [formField]="form.puid" [placeholder]="puidPlaceholder() | translate"> </vitamui-input>

    <vitamui-input class="w-100" [formField]="form.name" [placeholder]="'FILE_FORMATS.TAB.INFORMATION.NAME' | translate"> </vitamui-input>

    <vitamui-input class="w-100" [formField]="form.mimeType" [placeholder]="'FILE_FORMATS.TAB.INFORMATION.MIME_TYPE' | translate">
    </vitamui-input>

    <vitamui-input class="w-100" [formField]="form.version" [placeholder]="'FILE_FORMATS.TAB.INFORMATION.VERSION' | translate">
    </vitamui-input>

    <vitamui-input
      [multiple]="true"
      class="w-100"
      [formField]="form.extensions"
      [placeholder]="'FILE_FORMATS.TAB.INFORMATION.EXTENSION' | translate"
    >
    </vitamui-input>

    @if (isInternal()) {
      <vitamui-input
        [multiple]="true"
        class="w-100"
        [formField]="form.hasPriorityOverFileFormatIDs"
        [placeholder]="'FILE_FORMATS.TAB.INFORMATION.HAS_PRIORITY_OVER_FILE_FORMAT_ID' | translate"
      ></vitamui-input>
    }

    @if (isInternal() === false) {
      <vitamui-select
        [multiple]="true"
        class="w-100"
        [formField]="form.hasPriorityOverFileFormatIDs"
        [placeholder]="'FILE_FORMATS.TAB.INFORMATION.HAS_PRIORITY_OVER_FILE_FORMAT_ID' | translate"
        [searchBarPlaceHolder]="'FILE_FORMATS.TAB.INFORMATION.HAS_PRIORITY_OVER_FILE_FORMAT_ID_SEARCH' | translate"
        [options]="fileFormatOptions$ | async"
      >
      </vitamui-select>
    }

    <vitamui-input
      class="w-100"
      [formField]="form.createdDate"
      [placeholder]="'FILE_FORMATS.TAB.INFORMATION.CREATED_DATE' | translate"
    ></vitamui-input>

    <vitamui-input
      class="w-100"
      [formField]="form.updateDate"
      [placeholder]="'FILE_FORMATS.TAB.INFORMATION.MODIFIED_DATE' | translate"
    ></vitamui-input>

    <vitamui-input class="w-100" [formField]="form.versionPronom" [placeholder]="'FILE_FORMATS.TAB.INFORMATION.VERSION_PRONOM' | translate">
    </vitamui-input>
  </div>

  <button type="submit" class="btn primary" [disabled]="updateDisabled() || submitting() || unchanged() || form().invalid()">
    {{ 'COMMON.SAVE' | translate }}
  </button>
</form>
