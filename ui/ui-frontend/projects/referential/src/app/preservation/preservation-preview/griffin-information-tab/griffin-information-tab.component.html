<form [formRoot]="form" class="gap-6">
  <div class="gap-4 w-100">
    <vitamui-input class="w-100" [formField]="form.Identifier" [placeholder]="'PRESERVATION.TAB.INFORMATION.IDENTIFIER' | translate" />

    <vitamui-input class="w-100" [formField]="form.Name" [placeholder]="'PRESERVATION.TAB.INFORMATION.NAME' | translate" />

    <vitamui-input
      class="w-100"
      [formField]="form.ExecutableName"
      [placeholder]="'PRESERVATION.TAB.INFORMATION.EXECUTABLE_NAME' | translate"
    />

    <vitamui-input class="w-100" [formField]="form.ExecutableVersion" [placeholder]="'PRESERVATION.TAB.INFORMATION.VERSION' | translate" />

    <vitamui-input
      [textarea]="true"
      class="w-100"
      [formField]="form.Description"
      [placeholder]="'PRESERVATION.TAB.INFORMATION.DESCRIPTION' | translate"
    />

    <vitamui-input class="w-100" [formField]="creationDateForm" [placeholder]="'PRESERVATION.TAB.INFORMATION.CREATION_DATE' | translate" />

    <vitamui-input
      class="w-100"
      [formField]="lastUpdateForm"
      [placeholder]="'PRESERVATION.TAB.INFORMATION.MODIFICATION_DATE' | translate"
    />
  </div>

  <button type="submit" class="btn primary" [disabled]="unchanged() || form().invalid() || submitted()">
    {{ 'COMMON.SAVE' | translate }}
  </button>
</form>
