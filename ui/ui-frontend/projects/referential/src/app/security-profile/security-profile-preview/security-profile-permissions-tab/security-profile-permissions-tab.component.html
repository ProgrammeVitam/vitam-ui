<form [formRoot]="form" class="side-form">
  @if (form.fullAccess().value()) {
    <div class="mt-3">{{ 'SECURITY_PROFILE_APP.TAB.PERMISSIONS.ACCESS' | translate }}</div>
  }

  @if (!form.fullAccess().value()) {
    <div>
      <app-security-profile-edit-permission [formField]="form.permissions"></app-security-profile-edit-permission>
    </div>
  }

  <div class="actions mt-3">
    <button type="submit" class="btn primary" [disabled]="isInvalid() || unchanged() || submited()">
      {{ 'COMMON.SAVE' | translate }}
    </button>
  </div>
</form>
