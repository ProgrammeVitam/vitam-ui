<form [formGroup]="form" class="gap-5" (ngSubmit)="onSubmit()">
  <div class="gap-3 w-100 align-items-stretch">
    <vitamui-input formControlName="name" [placeholder]="'SECURITY_PROFILE_APP.TAB.INFORMATION.NAME' | translate"> </vitamui-input>

    <vitamui-slide-toggle formControlName="fullAccess">
      {{ 'SECURITY_PROFILE_APP.TAB.INFORMATION.ACCESS' | translate }}
    </vitamui-slide-toggle>
  </div>

  <button type="submit" class="btn primary" [disabled]="form.invalid || unchanged() || submitted">
    {{ 'COMMON.SAVE' | translate }}
  </button>
</form>
