<form [formGroup]="form" class="gap-5" (ngSubmit)="onSubmit()">
  <div class="gap-3 w-100">
    <vitamui-select
      class="w-100"
      formControlName="ruleType"
      [placeholder]="'RULES_APP.TAB.INFORMATION.TYPE' | translate"
      [options]="ruleTypes"
      [enableSearch]="false"
    ></vitamui-select>

    <vitamui-input class="w-100" formControlName="ruleValue" [placeholder]="'RULES_APP.TAB.INFORMATION.NAME' | translate"> </vitamui-input>

    <vitamui-input
      class="w-100"
      formControlName="ruleDuration"
      [placeholder]="'RULES_APP.TAB.INFORMATION.PERIOD' | translate"
      [errorMessageMap]="{
        pattern: 'RULES_APP.TAB.ERROR.INTEGER_REQUIRED' | translate,
      }"
    >
    </vitamui-input>

    <vitamui-select
      class="w-100"
      formControlName="ruleMeasurement"
      [placeholder]="'RULES_APP.TAB.INFORMATION.UNIT_MEASURE' | translate"
      [options]="ruleMeasurements"
      [enableSearch]="false"
    ></vitamui-select>

    <vitamui-input
      [textarea]="true"
      class="w-100"
      formControlName="ruleDescription"
      [placeholder]="'RULES_APP.TAB.INFORMATION.DESCRIPTION' | translate"
    >
    </vitamui-input>
  </div>

  <button type="submit" class="btn primary" [disabled]="isInvalid() || unchanged() || submited || (hasUpdateRuleRole$ | async) !== true">
    {{ 'COMMON.SAVE' | translate }}
  </button>
</form>
