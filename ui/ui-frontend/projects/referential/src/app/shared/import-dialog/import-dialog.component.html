<vitamui-dialog-header [subhead]="dialogParams.title" [title]="dialogParams.subtitle"></vitamui-dialog-header>

<mat-dialog-content>
  <vitamui-file-selector
    [formControl]="fileControl"
    [extensions]="extensions"
    [information]="dialogParams.fileFormatDetailInfo"
    [fileValidators]="usesCsvValidator ? csvValidator : null"
    [multiple]="false"
  />
</mat-dialog-content>

<mat-dialog-actions>
  <button type="button" class="btn primary" [disabled]="fileControl.invalid || isLoading || fileControl.pending" (click)="submitFile()">
    <span>{{ 'IMPORT_DIALOG.IMPORT' | translate }}</span>
    @if (isLoading) {
      <mat-spinner class="vitamui-spinner small ml-3"></mat-spinner>
    }
  </button>

  <button type="button" class="btn cancel link" (click)="cancel()">{{ 'COMMON.CANCEL' | translate }}</button>
</mat-dialog-actions>
