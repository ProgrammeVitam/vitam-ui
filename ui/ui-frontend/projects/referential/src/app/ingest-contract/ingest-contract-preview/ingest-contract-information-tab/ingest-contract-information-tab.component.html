<form [formRoot]="form" class="gap-5">
  <div class="gap-3 align-items-stretch w-100">
    <vitamui-slide-toggle
      [checked]="form.status().value() === 'ACTIVE'"
      [disabled]="!!readOnly()"
      (checkedChange)="onStatusChange($event)"
      class="w-100"
    >
      <span>{{
        'INGEST_CONTRACT.TAB.INFORMATION.' + (form.status().value() === 'ACTIVE' ? 'ACTIVE_CONTRACT' : 'INACTIVE_CONTRACT') | translate
      }}</span>
    </vitamui-slide-toggle>

    <vitamui-input
      [formField]="form.name"
      [placeholder]="'COMMON.NAME' | translate"
      class="w-100"
      [errorMessageMap]="{ nameExists: 'COMMON.NAME_ALREADY_EXISTS' | translate }"
    >
    </vitamui-input>

    <vitamui-input [textarea]="true" [formField]="form.description" [placeholder]="'COMMON.DESCRIPTION' | translate"> </vitamui-input>

    <vitamui-select
      [formField]="form.archiveProfiles"
      [placeholder]="'INGEST_CONTRACT.TAB.INFORMATION.ARCHIVE_PROFILE' | translate"
      [options]="archiveProfiles"
      [multiple]="true"
      [enableSearch]="false"
      [enableSelectAll]="false"
      [enableDisplaySelected]="false"
    >
    </vitamui-select>

    <vitamui-select
      [formField]="form.managementContractId"
      [placeholder]="'INGEST_CONTRACT.TAB.INFORMATION.MANAGEMENT_CONTRACT' | translate"
      [options]="managementContracts"
      [multiple]="false"
      [enableSearch]="false"
      [enableSelectAll]="false"
      [enableDisplaySelected]="false"
    >
    </vitamui-select>

    <vitamui-input
      [placeholder]="'INGEST_CONTRACT.TAB.INFORMATION.CREATION_DATE' | translate"
      [formField]="datesForm.creationDate"
    ></vitamui-input>

    <vitamui-input
      [placeholder]="'INGEST_CONTRACT.TAB.INFORMATION.LAST_MODIFICATION_DATE' | translate"
      [formField]="datesForm.lastUpdate"
    ></vitamui-input>

    <vitamui-input
      [placeholder]="'INGEST_CONTRACT.TAB.INFORMATION.ACTIVATION_DATE' | translate"
      [formField]="datesForm.activationDate"
    ></vitamui-input>

    <vitamui-input
      [placeholder]="'INGEST_CONTRACT.TAB.INFORMATION.DEACTIVATION_DATE' | translate"
      [formField]="datesForm.deactivationDate"
    ></vitamui-input>
  </div>

  <button type="submit" class="btn primary" [disabled]="isInvalid() || unchanged() || submitted">
    {{ 'COMMON.SAVE' | translate }}
  </button>
</form>
