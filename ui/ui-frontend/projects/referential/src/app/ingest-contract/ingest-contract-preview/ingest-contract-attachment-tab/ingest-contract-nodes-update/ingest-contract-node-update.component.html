<vitamui-dialog-header
  [stepper]="stepper"
  [subhead]="'INGEST_CONTRACT.UPDATE_NODE_DIALOG.UPDATE_SIP' | translate"
  [title]="['INGEST_CONTRACT.UPDATE_NODE_DIALOG.TITLE' | translate, 'INGEST_CONTRACT.CREATE_DIALOG.ATTACHEMENT_CONTROL' | translate]"
></vitamui-dialog-header>

<form [formGroup]="selectNodesForm" (ngSubmit)="updateIngestContractNodes()" (keydown.enter)="$event.preventDefault()">
  <vitamui-stepper #stepper>
    <cdk-step>
      <mat-dialog-content>
        <vitamui-library-filing-plan
          [formControl]="linkParentIdControl"
          [tenantIdentifier]="tenantIdentifier"
          [mode]="FILING_PLAN_MODE_SOLO"
        ></vitamui-library-filing-plan>
      </mat-dialog-content>

      <mat-dialog-actions>
        <vitamui-next-step></vitamui-next-step>
        <button type="button" class="btn cancel link" (click)="onCancel()">
          {{ 'COMMON.UNDO' | translate }}
        </button>
      </mat-dialog-actions>
    </cdk-step>

    <cdk-step>
      <mat-dialog-content>
        <div class="d-flex align-items-center mb-3">
          <mat-button-toggle-group [formControl]="checkParentLinkControl" class="vitamui-button-toggle-group">
            <mat-button-toggle [value]="'AUTHORIZED'">
              {{ 'INGEST_CONTRACT.TAB.ATTACHEMENT.CONTROL.AUTHORIZED' | translate }}
            </mat-button-toggle>
            <mat-button-toggle [value]="'REQUIRED'">
              {{ 'INGEST_CONTRACT.TAB.ATTACHEMENT.CONTROL.REQUIRED' | translate }}
            </mat-button-toggle>
            <mat-button-toggle [value]="'UNAUTHORIZED'">
              {{ 'INGEST_CONTRACT.TAB.ATTACHEMENT.CONTROL.UNAUTHORIZED' | translate }}
            </mat-button-toggle>
          </mat-button-toggle-group>

          <i
            class="vitamui-icon vitamui-icon-info text large primary ml-3"
            vitamuiTooltip="{{ 'INGEST_CONTRACT.UPDATE_NODE_DIALOG.ATTACHEMENT_CONTROL_INFO' | translate }}"
            vitamuiTooltipPosition="BOTTOM"
          >
          </i>
        </div>

        <vitamui-library-filing-plan
          [formControl]="checkParentIdControl"
          [tenantIdentifier]="tenantIdentifier"
          [mode]="FILING_PLAN_MODE_INC"
        ></vitamui-library-filing-plan>
      </mat-dialog-content>

      <mat-dialog-actions>
        <div>
          <button type="submit" class="btn primary">
            {{ 'COMMON.VALIDATE' | translate }}
          </button>
          <button type="button" class="btn cancel link" (click)="onCancel()">
            {{ 'COMMON.UNDO' | translate }}
          </button>
        </div>
        <vitamui-previous-step></vitamui-previous-step>
      </mat-dialog-actions>
    </cdk-step>
  </vitamui-stepper>
</form>
