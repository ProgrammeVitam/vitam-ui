<div class="gap-5">
  <div class="gap-3 w-100 align-items-stretch">
    <vitamui-input [formField]="form.Path" [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.PATH' | translate"> </vitamui-input>

    <vitamui-input [formField]="form.ApiPath" [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.API_PATH' | translate"> </vitamui-input>

    <vitamui-input [formField]="form.ShortName" [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.SHORT_NAME' | translate"> </vitamui-input>

    <vitamui-input [formField]="form.FieldName" [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.FIELD_NAME' | translate"> </vitamui-input>

    <vitamui-input [formField]="form.SedaField" [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.SEDA_FIELD' | translate"> </vitamui-input>

    <vitamui-input [formField]="form.ApiField" [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.API_FIELD' | translate"> </vitamui-input>

    <vitamui-input [formField]="form.Description" [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.DESCRIPTION' | translate">
    </vitamui-input>

    <vitamui-select
      [formField]="form.Type"
      [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.TYPE' | translate"
      [options]="types"
      [enableSearch]="false"
      [enableDisplaySelected]="false"
      [enableSelectAll]="false"
    ></vitamui-select>

    @if (stringSizeVisible) {
      <vitamui-input
        [formField]="form.StringSize"
        [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.STRING_SIZE' | translate"
      ></vitamui-input>
    }

    <vitamui-select
      [formField]="form.DataType"
      [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.TYPE_DETAIL' | translate"
      [options]="dataTypes"
      [enableSearch]="false"
      [enableDisplaySelected]="false"
      [enableSelectAll]="false"
    ></vitamui-select>

    @if (showCustomSearchTypes) {
      <vitamui-input
        [formField]="form.CustomSearchTypes"
        [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.CUSTOM_SEARCH_TYPES' | translate"
      ></vitamui-input>
    }

    <vitamui-select
      [formField]="form.Collection"
      [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.COLLECTION' | translate"
      [options]="collections"
      [enableSearch]="false"
      [enableDisplaySelected]="false"
      [enableSelectAll]="false"
    ></vitamui-select>

    <vitamui-select
      [formField]="form.Origin"
      [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.ORIGIN' | translate"
      [options]="origins"
      [enableSearch]="false"
      [enableDisplaySelected]="false"
      [enableSelectAll]="false"
    ></vitamui-select>

    <vitamui-select
      [formField]="form.Category"
      [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.CATEGORY' | translate"
      [options]="categories"
      [enableSearch]="false"
      [enableDisplaySelected]="false"
      [enableSelectAll]="false"
    ></vitamui-select>

    <vitamui-select
      [formField]="form.Cardinality"
      [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.CARDINALITY' | translate"
      [options]="cardinalities"
      [enableSearch]="false"
      [enableDisplaySelected]="false"
      [enableSelectAll]="false"
    ></vitamui-select>

    @if (!isExternal) {
      <vitamui-input
        [formField]="form.SedaVersions"
        [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.SEDA_VERSIONS' | translate"
      ></vitamui-input>
    }

    @if (isExternal) {
      <vitamui-input [formField]="form.CreationDate" [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.CREATION_DATE' | translate">
      </vitamui-input>
    }

    @if (isExternal) {
      <vitamui-input [formField]="form.LastUpdate" [placeholder]="'ONTOLOGY.SCHEMA.TAB.INFORMATION.MODIFICATION_DATE' | translate">
      </vitamui-input>
    }
  </div>

  <button type="submit" class="btn primary" [disabled]="true">
    {{ 'COMMON.SAVE' | translate }}
  </button>
</div>
