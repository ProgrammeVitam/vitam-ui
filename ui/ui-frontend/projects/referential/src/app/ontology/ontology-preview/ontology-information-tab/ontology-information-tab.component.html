<form [formRoot]="form" class="gap-5">
  <div class="gap-3 w-100">
    <vitamui-input class="w-100" [formField]="form.identifier" [placeholder]="'ONTOLOGY.TAB.INFORMATION.IDENTIFIER' | translate">
    </vitamui-input>

    <vitamui-input class="w-100" [formField]="form.shortName" [placeholder]="'ONTOLOGY.TAB.INFORMATION.NAME' | translate"> </vitamui-input>

    <vitamui-select
      class="w-100"
      [formField]="form.type"
      [placeholder]="'ONTOLOGY.TAB.INFORMATION.TYPE' | translate"
      [options]="types"
      [multiple]="false"
      [enableSearch]="false"
    ></vitamui-select>

    <vitamui-select
      [hidden]="!sizeFieldVisible()"
      class="w-100"
      [formField]="form.stringSize"
      [placeholder]="'ONTOLOGY.TAB.INFORMATION.FIELD_SIZE' | translate"
      [options]="sizes"
      [multiple]="false"
      [enableSearch]="false"
    ></vitamui-select>

    <vitamui-select
      class="w-100"
      [formField]="form.collections"
      [placeholder]="'ONTOLOGY.TAB.INFORMATION.COLLECTION' | translate"
      [options]="collections"
      [multiple]="true"
      [enableSearch]="false"
      [enableDisplaySelected]="false"
      [enableSelectAll]="false"
    ></vitamui-select>

    <vitamui-input
      [textarea]="true"
      class="w-100"
      [formField]="form.description"
      [placeholder]="'ONTOLOGY.TAB.INFORMATION.DESCRIPTION' | translate"
    >
    </vitamui-input>

    <vitamui-input class="w-100" [formField]="creationDateForm" [placeholder]="'ONTOLOGY.TAB.INFORMATION.CREATION_DATE' | translate">
    </vitamui-input>
  </div>

  <button type="submit" class="btn primary" [disabled]="unchanged() || form().invalid() || submitted()">
    {{ 'COMMON.SAVE' | translate }}
  </button>
</form>
