<mat-sidenav-container [autosize]="true" [hasBackdrop]="false">
  <mat-sidenav #panel mode="side" position="end" [fixedInViewport]="true" (vitamuiClickOutside)="onClose()">
    <app-ontology-preview *ngIf="openedItem" (previewClose)="closePanel()" [selectedElement]="openedItem"></app-ontology-preview>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="vitamui-heading">
      <vitamui-title-breadcrumb>
        <h5>{{ 'ONTOLOGY.HOME.TITLE' | translate }}</h5>
      </vitamui-title-breadcrumb>
      <vitamui-banner [searchbarPlaceholder]="'ONTOLOGY.HOME.SEARCH_PLACEHOLDER' | translate" (search)="onSearchSubmit($event)">
        <button class="btn primary ml-3 mr-3" [disabled]="canCreateVocabulary === false" (click)="openCreateOntologyDialog()">
          <span>{{ 'ONTOLOGY.HOME.CREATE_VOCABULARY' | translate }}</span>
        </button>
        <vitamui-menu-button [overlayPos]="'end'" [icon]="'vitamui-icon-more-horiz'" [disabled]="false">
          <button mat-menu-item [disabled]="canImportSchema === false" (click)="openSchemaImportDialog()">
            {{ 'ONTOLOGY.HOME.IMPORT_SCHEMA' | translate }}
          </button>
          <button mat-menu-item [disabled]="canImportOntology === false" (click)="openOntologyImportDialog()">
            {{ 'ONTOLOGY.HOME.IMPORT_ONTOLOGY' | translate }}
          </button>
        </vitamui-menu-button>
      </vitamui-banner>
    </div>

    <div class="vitamui-content">
      <app-ontology-group (selectElement)="showOntology($event)" [searchText]="search"></app-ontology-group>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
