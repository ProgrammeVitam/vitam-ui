<mat-sidenav-container [autosize]="true" [hasBackdrop]="false">
  <mat-sidenav #panel mode="side" position="end" [fixedInViewport]="true">
    @if (openedItem) {
      <app-agency-preview
        (previewClose)="closePanel()"
        [agency]="openedItem"
        [tenantIdentifier]="tenantIdentifier"
        [readOnly]="hasUpdateRole === false"
      ></app-agency-preview>
    }
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="vitamui-heading">
      <vitamui-title-breadcrumb>
        <h5>{{ 'AGENCY.HOME.TITLE' | translate }}</h5>
      </vitamui-title-breadcrumb>

      <vitamui-banner
        [searchbarPlaceholder]="'AGENCY.HOME.TITLE_PLACEHOLDER' | translate"
        [searchValue]="search"
        (search)="onSearchSubmit($event)"
      >
        <button class="btn primary mr-3" (click)="openCreateAgencyDialog()" [disabled]="!hasCreateRole">
          <span>{{ 'AGENCY.HOME.ACTION_BUTTON' | translate }}</span>
        </button>

        <vitamui-menu-button [overlayPos]="'end'" [icon]="'vitamui-icon-more-horiz'" [disabled]="!hasImportRole && !hasExportRole">
          <button mat-menu-item [disabled]="!hasImportRole" (click)="openAgencyImportDialog()">
            {{ 'AGENCY.HOME.ACTION_IMPORT' | translate }}
          </button>
          <button mat-menu-item [disabled]="!agencyList?.dataSource?.length || !hasExportRole" (click)="exportAgencies()">
            {{ 'AGENCY.HOME.ACTION_EXPORT' | translate }}
          </button>
        </vitamui-menu-button>
      </vitamui-banner>
    </div>

    <div class="vitamui-content">
      <app-agency-list #agencyList (agencyClick)="showAgency($event)" [search]="search"></app-agency-list>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
