<form [formGroup]="form" (ngSubmit)="onSubmit()" class="gap-5">
  <div class="gap-3 w-100 align-items-stretch">
    <vitamui-input
      [disabled]="(checkUpdateRole | async) === false"
      formControlName="name"
      [placeholder]="'AGENCY.TAB.NAME' | translate"
      [errorMessageMap]="{
        nameExists: 'AGENCY.CREATE_DIALOG.NAME_ALREADY_EXISTS' | translate,
      }"
    >
    </vitamui-input>

    <vitamui-input
      [disabled]="(checkUpdateRole | async) === false"
      formControlName="description"
      [placeholder]="'AGENCY.TAB.DESCRIPTION' | translate"
      [textarea]="true"
    >
    </vitamui-input>
  </div>

  <button
    *ngIf="checkUpdateRole | async"
    type="submit"
    class="btn primary mt-3"
    [disabled]="isInvalid() || unchanged() || isLoading || (checkUpdateRole | async) !== true"
  >
    <span>{{ 'COMMON.SAVE' | translate }} </span>
  </button>
</form>
