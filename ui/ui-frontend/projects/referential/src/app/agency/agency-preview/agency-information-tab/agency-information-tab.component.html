<form [formRoot]="form" class="gap-5">
  <div class="gap-3 w-100 align-items-stretch">
    <vitamui-input
      [formField]="form.name"
      [placeholder]="'AGENCY.TAB.NAME' | translate"
      [errorMessageMap]="{
        nameExists: 'AGENCY.CREATE_DIALOG.NAME_ALREADY_EXISTS' | translate,
        onlyWhitespaces: 'AGENCY.CREATE_DIALOG.INVALID_FIELD' | translate,
      }"
    >
    </vitamui-input>

    <vitamui-input [formField]="form.description" [placeholder]="'AGENCY.TAB.DESCRIPTION' | translate" [textarea]="true"> </vitamui-input>
  </div>

  @if (checkUpdateRole | async) {
    <button
      type="submit"
      class="btn primary mt-3"
      [disabled]="isInvalid() || unchanged() || isLoading() || (checkUpdateRole | async) !== true"
    >
      <span>{{ 'COMMON.SAVE' | translate }} </span>
    </button>
  }
</form>
