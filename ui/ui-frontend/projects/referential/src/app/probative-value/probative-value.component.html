<mat-sidenav-container [autosize]="true" [hasBackdrop]="false">
  <mat-sidenav #panel mode="side" position="end" [fixedInViewport]="true">
    <app-probative-value-preview
      *ngIf="openedItem"
      [probativeValue]="openedItem"
      (previewClose)="closePanel()"
    ></app-probative-value-preview>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="vitamui-heading">
      <vitamui-common-title-breadcrumb>
        <h5>{{ 'PROBATIVE_VALUE.HOME.TITLE' | translate }}</h5>
      </vitamui-common-title-breadcrumb>

      <vitamui-common-banner
        [searchbarPlaceholder]="'PROBATIVE_VALUE.HOME.SEARCH_PLACEHOLDER' | translate"
        (search)="onSearchSubmit($event)"
      >
        <button class="btn primary mr-3" (click)="openCreateProbativeValueDialog()">
          <span>{{ 'PROBATIVE_VALUE.HOME.GENERATE_VALUE' | translate }}</span>
        </button>
      </vitamui-common-banner>

      <form [formGroup]="dateRangeFilterForm" class="d-flex align-items-center mt-4 px-2 hgap-3">
        <vitamui-common-multiple-options-datepicker
          formControlName="startDate"
          [label]="'PROBATIVE_VALUE.HOME.START_DATE' | translate"
          [max]="dateRangeFilterForm.get('endDate')?.value"
        ></vitamui-common-multiple-options-datepicker>
        <vitamui-common-multiple-options-datepicker
          formControlName="endDate"
          [label]="'PROBATIVE_VALUE.HOME.END_DATE' | translate"
          [min]="dateRangeFilterForm.get('startDate')?.value"
        ></vitamui-common-multiple-options-datepicker>
      </form>
    </div>

    <div class="vitamui-content">
      <app-probative-value-list
        (probativeValueClick)="showProbativeValue($event)"
        [search]="search"
        [filters]="filters"
      ></app-probative-value-list>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
