<vitamui-dialog-header [title]="'GROUP.INFORMATIONS.MODAL.UPDATE_UNITS' | translate: { name: data?.group?.name }"></vitamui-dialog-header>

<form [formRoot]="form">
  <mat-dialog-content>
    <app-units-form [customer]="data?.group?.customerId" [formField]="form.units"></app-units-form>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button type="submit" class="btn primary" [disabled]="!form().dirty() || form().invalid()">{{ 'COMMON.SUBMIT' | translate }}</button>
    <button type="button" class="btn cancel link" (click)="onCancel()">{{ 'COMMON.UNDO' | translate }}</button>
  </mat-dialog-actions>
</form>
