<vitamui-dialog-header
  [stepper]="stepper"
  [subhead]="'EXTERNAL_PARAM_PROFILE.CREATE_EXTERNAL_PARAM_PROFILE_POPUP' | translate"
  [title]="[
    'EXTERNAL_PARAM_PROFILE.CREATE_EXTERNAL_PARAM_PROFILE_POPUP_SUBTITLE' | translate,
    'EXTERNAL_PARAM_PROFILE.MAX_BULK_OPERATIONS_THRESHOLD_TITLE' | translate,
  ]"
></vitamui-dialog-header>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <vitamui-stepper #stepper>
    <cdk-step>
      <mat-dialog-content class="gap-3 align-items-stretch">
        <vitamui-slide-toggle formControlName="enabled">
          {{ 'EXTERNAL_PARAM_PROFILE.PROFILE' | translate }}
          <span *ngIf="!form.controls.enabled.value">in</span>
          {{ 'COMMON.ACTIVE' | translate }}
        </vitamui-slide-toggle>

        <vitamui-input
          formControlName="name"
          [placeholder]="'EXTERNAL_PARAM_PROFILE.EXTERNAL_PARAM_PROFILE_NAME_POPUP' | translate"
          [errorMessageMap]="{
            nameExists: 'COMMON.ERROR.NAME_ALREADY_EXISTS' | translate,
          }"
        >
        </vitamui-input>

        <vitamui-input formControlName="description" [placeholder]="'EXTERNAL_PARAM_PROFILE.DESCRIPTION_ADMIN_PROFILE' | translate">
        </vitamui-input>

        <vitamui-select
          formControlName="accessContract"
          [placeholder]="'EXTERNAL_PARAM_PROFILE.SELECT_ACCESS_CONTRACT' | translate"
          [options]="activeAccessContractsIdentifiers$ | async"
          [multiple]="false"
          [enableSearch]="false"
        ></vitamui-select>
      </mat-dialog-content>

      <mat-dialog-actions>
        <vitamui-next-step [disabled]="firstStepInvalid()"></vitamui-next-step>
        <button type="button" class="btn link cancel" (click)="onCancel()">
          {{ 'COMMON.CANCEL' | translate }}
        </button>
      </mat-dialog-actions>
    </cdk-step>

    <cdk-step>
      <mat-dialog-content class="gap-3 align-items-stretch">
        <vitamui-slide-toggle formControlName="usePlatformThreshold">
          {{ 'EXTERNAL_PARAM_PROFILE.USE_PLATFORM_BULK_OPERATIONS_THRESHOLD_TITLE' | translate }}
        </vitamui-slide-toggle>

        <div class="select-threshold" *ngIf="!form.controls.usePlatformThreshold.value">
          <vitamui-select
            class="w-100"
            formControlName="bulkOperationsThreshold"
            [placeholder]="'EXTERNAL_PARAM_PROFILE.USE_PLATFORM_BULK_OPERATIONS_THRESHOLD_TITLE' | translate"
            [options]="thresholdOptions"
            [multiple]="false"
            [enableSearch]="false"
          ></vitamui-select>

          <i
            class="vitamui-icon vitamui-icon-info-circle vitamui-row-icon icon-information"
            [vitamuiTooltip]="'EXTERNAL_PARAM_PROFILE.MAX_BULK_OPERATIONS_THRESHOLD_HELPER' | translate"
            [vitamuiTooltipShowDelay]="300"
          ></i>
        </div>
      </mat-dialog-content>

      <mat-dialog-actions>
        <div>
          <button type="submit" class="btn primary" [disabled]="isFormInvalid()">
            {{ 'COMMON.SUBMIT' | translate }}
          </button>
          <button type="button" class="btn link cancel" (click)="onCancel()">
            {{ 'COMMON.CANCEL' | translate }}
          </button>
        </div>
        <vitamui-previous-step></vitamui-previous-step>
      </mat-dialog-actions>
    </cdk-step>
  </vitamui-stepper>
</form>
