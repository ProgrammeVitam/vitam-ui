<div>
  <form [formGroup]="form" class="gap-3 align-items-stretch">
    <vitamui-common-slide-toggle formControlName="enabled">
      {{ 'EXTERNAL_PARAM_PROFILE.PROFILE' | translate }} <span *ngIf="!form.get('enabled')?.value">in</span
      >{{ 'COMMON.ACTIVE' | translate }}
    </vitamui-common-slide-toggle>

    <div class="row">
      <div class="col-6">
        <div class="vitamui-input" [class.disabled]="true">
          <label [ngStyle]="{ 'margin-bottom': '35px' }"> {{ 'COMMON.ID' | translate }}</label>

          <input
            [ngStyle]="{ 'margin-top': '15px' }"
            [type]="'text'"
            [required]="true"
            [value]="externalParamProfile?.profileIdentifier"
            [disabled]="true"
          />
        </div>
      </div>
      <vitamui-common-editable-input
        class="col-6"
        formControlName="name"
        maxlength="100"
        [label]="'EXTERNAL_PARAM_PROFILE.NAME' | translate"
        [validator]="form?.get('name')?.validator"
        [asyncValidator]="form?.get('name')?.asyncValidator"
      >
        <vitamui-common-field-error errorKey="required">{{
          'EXTERNAL_PARAM_PROFILE.INPUT_REQUIRED' | translate
        }}</vitamui-common-field-error>
        <vitamui-common-field-error errorKey="nameExists">{{
          'EXTERNAL_PARAM_PROFILE.NAME_ALREADY_USED' | translate
        }}</vitamui-common-field-error>
      </vitamui-common-editable-input>
    </div>

    <vitamui-common-editable-input
      formControlName="description"
      maxlength="380"
      label="{{ 'EXTERNAL_PARAM_PROFILE.DESCRIPTION' | translate }}"
      [validator]="form?.get('description')?.validator"
    >
      <vitamui-common-field-error errorKey="required">{{ 'EXTERNAL_PARAM_PROFILE.INPUT_REQUIRED' | translate }}</vitamui-common-field-error>
    </vitamui-common-editable-input>

    <vitamui-select
      formControlName="accessContract"
      [placeholder]="'EXTERNAL_PARAM_PROFILE.SELECT_ACCESSCONTRACT' | translate"
      [options]="activeAccessContractsIdentifiers"
      [multiple]="false"
      [enableSearch]="false"
    ></vitamui-select>
  </form>
</div>
