<ng-container [formGroup]="formGroup">
  @for (color of [THEME_COLORS.VITAMUI_PRIMARY, THEME_COLORS.VITAMUI_SECONDARY]; track color) {
    <div>
      <app-input-color
        [disabled]="disabled"
        [colorInput]="$any(formGroup.get(color))"
        [checkWarning]="true"
        [placeholder]="baseColors[color] | translate"
      >
      </app-input-color>
    </div>
  }

  @if (!displayTertiary) {
    <small class="pb-2" (click)="displayTertiary = !displayTertiary">{{
      'CUSTOMER.GRAPHIC_IDENTITY.TERTIARY_COLOR_SHOW' | translate
    }}</small>
  } @else {
    <small class="pb-2" (click)="displayTertiary = !displayTertiary">{{
      'CUSTOMER.GRAPHIC_IDENTITY.TERTIARY_COLOR_HIDE' | translate
    }}</small>
  }

  <app-input-color
    [style.display]="!displayTertiary ? 'none' : 'block'"
    [disabled]="disabled"
    [colorInput]="$any(formGroup.get(THEME_COLORS.VITAMUI_TERTIARY))"
    [checkWarning]="true"
    [placeholder]="'COLOR.TERTIARY' | translate"
  >
  </app-input-color>

  <app-input-color
    [colorInput]="$any(formGroup.get(THEME_COLORS.VITAMUI_HEADER_FOOTER))"
    [disabled]="disabled"
    [placeholder]="'COLOR.HEADER_FOOTER' | translate"
  >
  </app-input-color>

  <vitamui-select
    class="mb-4"
    [placeholder]="'COLOR.BACKGROUND' | translate"
    [disabled]="disabled"
    [options]="backgroundColorsOptions"
    [multiple]="false"
    [ngModel]="selectedBgColor"
    (ngModelChange)="updateBackgroundColor($event)"
    [ngModelOptions]="{ standalone: true }"
    [enableSearch]="false"
  ></vitamui-select>
</ng-container>
