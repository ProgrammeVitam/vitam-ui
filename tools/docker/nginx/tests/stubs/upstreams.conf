## Upstream stubs for the test suite. They return a JSON describing what they
## received, proving both the routing and the client certificate presented.

log_format stub '$remote_addr $status "$request" dn=$ssl_client_s_dn';
access_log /var/log/nginx/stub.log stub;

## api-gateway stub — requires a client certificate, like the real one.
server {
    listen      ${STUB_GATEWAY_PORT} ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/servers/api-gateway/api-gateway.crt;
    ssl_certificate_key /etc/nginx/certs/servers/api-gateway/api-gateway.key;

    ssl_client_certificate /etc/nginx/ca/ca-chain.crt;
    ssl_verify_client      on;
    ssl_verify_depth       3;

    location / {
        default_type application/json;
        return 200 '{"stub":"api-gateway","uri":"$request_uri","client_dn":"$ssl_client_s_dn","verify":"$ssl_client_verify"}';
    }
}

## cas-server stub — carries the /cas context-path, as in dev.
server {
    listen      ${STUB_CAS_PORT} ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/servers/cas-server/cas-server.crt;
    ssl_certificate_key /etc/nginx/certs/servers/cas-server/cas-server.key;

    location / {
        default_type application/json;
        return 200 '{"stub":"cas","uri":"$request_uri","host":"$host"}';
    }
}

## Angular dev-server stub — for the ng-serve override test.
server {
    listen      ${STUB_NG_SERVE_PORT} ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/servers/reverse/reverse.crt;
    ssl_certificate_key /etc/nginx/certs/servers/reverse/reverse.key;

    location / {
        default_type application/json;
        return 200 '{"stub":"ng-serve","uri":"$request_uri"}';
    }
}
