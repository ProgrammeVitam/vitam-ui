## Reverse proxy de developpement VitamUI : une origine unique devant tous les
## fronts Angular, l'api-gateway et cas-server.
##
##   ./vitamui-nginx.sh up        demarre
##   ./vitamui-nginx.sh status    etat + sonde
##   ./tests/run-tests.sh         suite de tests
##
## Les valeurs par defaut ci-dessous correspondent au poste de dev standard.
## Pour les surcharger, copier .env.example en .env.

services:
  nginx:
    image: nginx:1.29-alpine
    ## Le nom de conteneur est global a docker, pas au projet compose : sans cette
    ## variable, la suite de tests ne pourrait pas demarrer sa propre pile tant
    ## que l'instance de dev tourne. tests/run-tests.sh la surcharge.
    container_name: ${VITAMUI_CONTAINER_NAME:-vitamui-nginx}
    restart: unless-stopped

    ## Reseau de l'hote : l'api-gateway (8070) et cas-server (8080) tournent en
    ## processus java sur la machine, pas dans docker. C'est aussi ce qui permet
    ## de proxifier un `ng serve` lance a la main.
    network_mode: host

    environment:
      ## L'entrypoint officiel de l'image rend conf/templates/*.template dans
      ## /etc/nginx/conf.d/. Le filtre restreint la substitution aux variables
      ## VITAMUI_*, ce qui laisse intactes les variables nginx ($uri, $host...).
      NGINX_ENVSUBST_FILTER: '^VITAMUI_'
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d

      VITAMUI_SERVER_NAME: ${VITAMUI_SERVER_NAME:-dev.vitamui.com}
      VITAMUI_PUBLIC_ORIGIN: ${VITAMUI_PUBLIC_ORIGIN:-https://dev.vitamui.com}
      VITAMUI_HTTP_PORT: ${VITAMUI_HTTP_PORT:-80}
      VITAMUI_HTTPS_PORT: ${VITAMUI_HTTPS_PORT:-443}
      VITAMUI_GATEWAY: ${VITAMUI_GATEWAY:-127.0.0.1:8070}
      VITAMUI_CAS: ${VITAMUI_CAS:-127.0.0.1:8080}

    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/snippets:/etc/nginx/snippets:ro
      - ./conf/templates:/etc/nginx/templates:ro

      ## Passphrase des cles clientes de dev-deployment, qui sont chiffrees.
      - ./conf/proxy_ssl_password:/etc/nginx/proxy_ssl_password:ro

      ## Neutralise le vhost par defaut de l'image, qui ecoute lui aussi sur 80.
      - ./conf/disabled-default.conf:/etc/nginx/conf.d/default.conf:ro

      ## Surcharges `ng serve`, vide par defaut (cf. vitamui-nginx.sh ng-serve).
      - ./ng-serve:/etc/nginx/ng-serve:ro

      ## Les dist/ Angular : un sous-repertoire par application.
      - ${VITAMUI_DIST_DIR:-../../../ui/ui-frontend/dist}:/usr/share/nginx/html/vitamui:ro

      ## Certificats de dev : servers/reverse pour la terminaison TLS,
      ## clients/ui-* pour le mTLS vers l'api-gateway.
      - ${VITAMUI_CERTS_DIR:-../../../dev-deployment/environments/certs/vitamui-services}:/etc/nginx/certs:ro

    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --no-check-certificate
        - --spider
        - https://${VITAMUI_SERVER_NAME:-dev.vitamui.com}:${VITAMUI_HTTPS_PORT:-443}/__vitamui/health
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
