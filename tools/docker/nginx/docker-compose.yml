version: '3'
services:
  nginx:
    image: nginx
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ../../../../vitam-ui/ui/ui-frontend/dist:/usr/share/nginx/html/vitamui:z
      - ../../../dev-deployment/environments/certs/vitamui-services:/etc/nginx/certs/vitamui-services
