## Configuration nginx globale du reverse proxy de developpement VitamUI.
##
## Le vhost lui-meme vit dans conf/templates/vitamui.conf.template : il est rendu
## au demarrage du conteneur par l'entrypoint officiel de l'image nginx, qui
## substitue les variables ${VITAMUI_*} (cf. NGINX_ENVSUBST_FILTER dans le
## docker-compose.yml) et depose le resultat dans /etc/nginx/conf.d/.

worker_processes  auto;
error_log  /var/log/nginx/error.log  notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  vitamui  '$remote_addr $status $request_time "$request" '
                         'upstream=$upstream_addr/$upstream_status '
                         'client_cert=$vitamui_client';
    access_log  /var/log/nginx/access.log  vitamui;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    ## Versement de SIP : pas de limite de taille (cf. role nginx_webapp, qui
    ## pose client_max_body_size 0 pour ui-ingest et ui-collect).
    client_max_body_size 0;

    ## Les blocs `map` doivent vivre dans le contexte http.
    include /etc/nginx/snippets/maps.conf;

    include /etc/nginx/conf.d/*.conf;
}
