## Global nginx config for the VitamUI dev reverse proxy. The vhost itself is
## rendered from conf/templates/vitamui.conf.template by the image entrypoint.

worker_processes  auto;
error_log  /var/log/nginx/error.log  notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  vitamui  '$remote_addr $status $request_time "$request" '
                         'upstream=$upstream_addr/$upstream_status '
                         'client_cert=$vitamui_client';
    access_log  /var/log/nginx/access.log  vitamui;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    ## No upload size limit (SIP uploads), as in the nginx_webapp role.
    client_max_body_size 0;

    ## map blocks must live in the http context.
    include /etc/nginx/snippets/maps.conf;

    include /etc/nginx/conf.d/*.conf;
}
