## Large SIP upload settings, from nginx_webapp's vhost.conf.j2. Applied to
## all APIs in dev: harmless, and avoids one extra location per app.

## Stream the request body to the upstream.
proxy_request_buffering off;

## Give the gateway time to consume the stream (avoids "Early EOF"), then to
## process the file once uploaded.
proxy_send_timeout 600s;
proxy_read_timeout 600s;
