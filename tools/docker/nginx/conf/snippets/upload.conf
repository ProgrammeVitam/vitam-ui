## Reglages pour le versement de gros SIP (ui-ingest, ui-collect).
## Reprise de deployment/roles/nginx_webapp/templates/frontend/vhost.conf.j2.
##
## En dev on les applique a toutes les APIs : ca ne coute rien et ca evite un
## bloc `location` supplementaire par application.

## Le corps de la requete est transmis a l'upstream au fil de l'eau.
proxy_request_buffering off;

## Laisse a la gateway le temps de consommer le flux (evite les "Early EOF"),
## puis de traiter le fichier une fois l'upload termine.
proxy_send_timeout 600s;
proxy_read_timeout 600s;
