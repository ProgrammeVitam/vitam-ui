## Correspondance prefixe d'API -> nom du certificat client presente a l'api-gateway.
##
## Reproduit deployment/roles/nginx_webapp/templates/frontend/vhost.conf.j2 :
## chaque front s'authentifie aupres de la gateway avec SON certificat client,
## celui qui est enregistre dans la collection security.certificates.
##
## Seule irregularite : le front `identity` appelle /identity-api mais presente le
## certificat `ui-identity-admin` (cf. ui/ui-frontend/proxy.conf.js, entree
## { name: 'identity', crt: 'identity-admin' }).
## Bascule websocket, utilisee par les surcharges `ng serve` (le client vite
## ouvre une connexion Upgrade pour le rechargement a chaud). Repasser
## Connection en "close" hors upgrade evite de casser le keepalive.
map $http_upgrade $vitamui_connection_upgrade {
    default "upgrade";
    ""      "close";
}

map $vitamui_api $vitamui_client {
    default           "";
    "portal"          "ui-portal";
    "identity"        "ui-identity-admin";
    "referential"     "ui-referential";
    "ingest"          "ui-ingest";
    "archive-search"  "ui-archive-search";
    "collect"         "ui-collect";
    "pastis"          "ui-pastis";
}
