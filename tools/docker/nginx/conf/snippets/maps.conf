## Websocket upgrade toggle, used by the ng-serve overrides (vite hot reload).
map $http_upgrade $vitamui_connection_upgrade {
    default "upgrade";
    ""      "close";
}

## API prefix -> client certificate presented to the api-gateway. Mirrors
## frontend_apis in deployment/roles/nginx_webapp/defaults/main.yml, except
## for identity: it presents ui-identity-admin, not ui-identity. The dev
## database registers no certificate for ui_identity_context
## (tools/docker/mongo/hosts leaves hosts_ui_identity empty: "same certificat
## is used for these apps"), so ui-identity would be rejected by the gateway.
map $vitamui_api $vitamui_client {
    default           "";
    "portal"          "ui-portal";
    "identity"        "ui-identity-admin";
    "identity-admin"  "ui-identity-admin";
    "referential"     "ui-referential";
    "ingest"          "ui-ingest";
    "archive-search"  "ui-archive-search";
    "collect"         "ui-collect";
    "pastis"          "ui-pastis";
}
