## Entetes communs au service des applications Angular.
##
## Contrairement a la prod (role nginx_webapp, qui cache les assets 1800s), on
## desactive tout cache en dev : un asset servi depuis le cache apres un rebuild
## est la premiere source de faux bugs.
add_header X-Content-Type-Options "nosniff" always;
add_header Cache-Control "no-store" always;
