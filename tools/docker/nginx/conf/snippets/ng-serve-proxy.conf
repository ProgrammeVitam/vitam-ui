## Live proxying to an Angular dev server (`npm run start:<app>`). The calling
## location sets `error_page 502 = @...` to its dist fallback: a connection
## refused is a 502 generated by nginx itself, so error_page catches exactly
## the "dev server not running" case (no proxy_intercept_errors: a real
## dev-server response is passed through untouched).

## The dev server runs in https (--ssl in ui/ui-frontend's start script) with
## a self-signed dev certificate: no verification.
proxy_ssl_verify      off;
proxy_ssl_server_name on;

## Hot reload: the dev client opens a websocket (cf. snippets/maps.conf).
proxy_http_version 1.1;
proxy_set_header   Upgrade $http_upgrade;
proxy_set_header   Connection $vitamui_connection_upgrade;
proxy_read_timeout 86400s;

include /etc/nginx/snippets/proxy_params.conf;
