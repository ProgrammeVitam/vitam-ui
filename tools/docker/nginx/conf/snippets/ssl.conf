## Terminaison TLS du reverse proxy.
##
## On utilise le certificat `reverse` de dev-deployment : c'est le seul dont le
## CN vaut dev.vitamui.com (SAN : dev.vitamui.com, localhost), donc le seul qui
## corresponde a une origine unique. Les certificats ui-* servent, eux, a
## s'authentifier aupres de l'api-gateway (cf. snippets/maps.conf).
ssl_certificate     /etc/nginx/certs/servers/reverse/reverse.crt;
ssl_certificate_key /etc/nginx/certs/servers/reverse/reverse.key;

## Aligne sur deployment/roles/nginx_webapp/templates/ssl-ui.conf.j2
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
ssl_prefer_server_ciphers on;
ssl_session_cache         shared:SSL:10m;
ssl_ecdh_curve            secp384r1;
