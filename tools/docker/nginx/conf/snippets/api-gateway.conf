## Shared body of the locations proxying API calls to the api-gateway.
## Expects $vitamui_api to be set by the calling location. proxy_pass stays in
## each location: a named upstream block would share the outgoing SSL context,
## making nginx present another app's client certificate to the gateway.

proxy_ssl_certificate     /etc/nginx/certs/clients/$vitamui_client/$vitamui_client.crt;
proxy_ssl_certificate_key /etc/nginx/certs/clients/$vitamui_client/$vitamui_client.key;

## dev-deployment client keys are encrypted; without this nginx fails with
## "cannot load certificate key ... bad decrypt".
proxy_ssl_password_file   /etc/nginx/proxy_ssl_password;

## Apps must not share TLS sessions, or the gateway maps the wrong security
## context (same reason as in production).
proxy_ssl_session_reuse off;

## Self-signed dev certificates: no upstream chain verification. Dev only.
proxy_ssl_verify      off;
proxy_ssl_server_name on;

include /etc/nginx/snippets/proxy_params.conf;
include /etc/nginx/snippets/upload.conf;
