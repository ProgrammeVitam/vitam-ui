## Corps commun des locations qui portent un appel d'API vers l'api-gateway.
##
## Partage entre la forme absolue (/<app>-api/...) et la forme relative au
## <base href> (/<app>/<app>-api/...). Attend que $vitamui_api ait ete pose par
## la location appelante ; $vitamui_client en decoule via snippets/maps.conf.
##
## Le `proxy_pass` reste dans chaque location, avec l'adresse litterale issue de
## ${VITAMUI_GATEWAY} : passer par un bloc `upstream` nomme fait partager le
## contexte SSL sortant entre les locations, et nginx finit par presenter a la
## gateway le certificat client d'une autre application. Verifie : avec un
## upstream nomme, quatre applications sur six presentaient ui-referential.

proxy_ssl_certificate     /etc/nginx/certs/clients/$vitamui_client/$vitamui_client.crt;
proxy_ssl_certificate_key /etc/nginx/certs/clients/$vitamui_client/$vitamui_client.key;

## Les cles clientes de dev-deployment sont chiffrees (ENCRYPTED PRIVATE KEY).
## Sans ce fichier, nginx echoue a l'ouverture de la connexion amont avec
## « cannot load certificate key ... bad decrypt » et renvoie 500.
proxy_ssl_password_file   /etc/nginx/proxy_ssl_password;

## Deux applications ne doivent pas rejouer la meme session TLS, sinon la
## gateway leur attribue le mauvais contexte de securite. Meme raison qu'en prod.
proxy_ssl_session_reuse off;

## Certificats de dev auto-signes : on ne verifie pas la chaine cote sortant.
## A ne pas reproduire hors poste de developpement.
proxy_ssl_verify      off;
proxy_ssl_server_name on;

include /etc/nginx/snippets/proxy_params.conf;
include /etc/nginx/snippets/upload.conf;
