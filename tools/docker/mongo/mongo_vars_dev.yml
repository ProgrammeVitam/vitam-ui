pki_dir: "{{lookup('env','PWD')}}/../../../dev-deployment/environments/certs"

# Overwrite vitamui defaults in order to perform transparent execution of deployment scripts.

hide_passwords_during_deploy: false

gateway:
  enabled: true

vitamui_defaults:
  folder:
    root_path: "{{lookup('env','PWD')}}/mongo-entrypoint"
  users:
    vitamuidb: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"

mongodb:
  included_scripts:
    - ".*"
  excluded_scripts:
    - "nothing"
  docker:
    enable: true
    image_name: vitamui-mongo
    internal_dir: /scripts/mongo/data
  mongod_port: 27018
  passphrase: mongogo
  admin:
    db: admin
    user: "mongod_dbuser_admin"
    password: "mongod_dbpwd_admin"
    roles: '[{ role: "userAdminAnyDatabase", db: "admin" }, { role: "backup", db: "admin" }, { role: "restore", db: "admin" }, { role: "dbAdminAnyDatabase", db: "admin" }, { role: "readWriteAnyDatabase", db: "admin" }, { role: "clusterMonitor", db:"admin"}, { role: "root", db:"admin"}]'
  localadmin:
    db: admin
    user: "mongod_dbuser_localadmin"
    password: "mongod_dbpwd_localadmin"
    roles: '[{ role: "clusterAdmin", db: "admin" },{ role: "dbAdminAnyDatabase", db: "admin" },{ role: "readWriteAnyDatabase", db: "admin" }]'
  security:
    db: security
    user: "mongod_dbuser_security"
    password: "mongod_dbpwd_security"
    roles: '[{ role: "readWrite", db: "security" }]'
  iam:
    db: iam
    user: "mongod_dbuser_iam"
    password: "mongod_dbpwd_iam"
    roles: '[{ role: "readWrite", db: "iam" }]'
  cas:
    db: cas
    user: "mongod_dbuser_cas"
    password: "mongod_dbpwd_cas"
    roles: '[{ role: "readWrite", db: "cas" }]'
  versioning:
    enable: false
    db: versioning
    user: "mongod_dbuser_versioning"
    password: "mongod_dbpwd_versioning"
    roles: '[{ role: "readWrite", db: "versioning" }]'
  archivesearch:
    db: archivesearch
    user: "mongod_dbuser_archivesearch"
    password: "mongod_dbpwd_archivesearch"
    roles: '[{ role: "readWrite", db: "archivesearch" }]'

mongod_replicaset_name: "rs0"

# Origine unique servie par le reverse proxy de dev (tools/docker/nginx).
# Les templates de deployment/scripts/mongod/ construisent les URL des
# applications et les serviceId CAS a partir de cette valeur.
url_prefix: "https://dev.vitamui.com"

# Variables for users

vitamui_platform_informations:
  name: "system_customer"
  description: "System Customer"
  company_name: "system company"
  default_email_domain: "change-it.fr"
  email_domains: "change-it.fr"
  default_password: "$2a$10$5X2kf8hP52sA6HKe2t2vm.ulwx9bs3HI/QT/tg1k5/fQu0WFtSoUW" # password
  address:
    street: change-it
    zip_code: change-it
    city: change-it
    country: change-it
  proof_tenant: 1
  cas_tenant: -1
  platform_name: VITAM-UI

# ----------------------------------------------------------------------------------------------------------------------
# cas services cert value override

vitam_site_name: "dev"

# Chaque application est identifiee par son prefixe sous l'origine unique, et
# non plus par un port. C'est la meme forme d'URL que les environnements
# deployes : https://<host>/archive-search/archive-search/tenant/1.
#
# Le serviceId est la regexp que CAS confronte a l'URL de service. Celui du
# portail couvre la racine, donc toutes les autres applications : c'est
# volontaire et sans danger, son service porte evaluationOrder 10000, donc CAS
# ne le retient qu'apres avoir essaye les services plus specifiques (cf.
# deployment/scripts/mongod/v7.1/003_TRV-399_...portal_service_ref.js.j2).
#
# Le quadruple antislash traverse deux niveaux d'echappement : YAML, puis la
# chaine JavaScript du script mongo. Il aboutit a "\." dans la regexp.
#
# ui_identity et ui_identity_admin partagent la meme URL : en dev une seule
# application Angular « identity » tient les deux roles, la ou la prod deploie
# deux instances (/identity et /identity-admin).
vitamui:
  ui_identity:
    clientId: identity
    name: Identity Access Management Application
    base_url: "https://dev.vitamui.com/identity"
    serviceId: "^https://dev\\\\.vitamui\\\\.com/identity/.*|https://localhost/identity/.*"
  ui_identity_admin:
    clientId: identityadmin
    name: Identity Admin Access Management Application
    base_url: "https://dev.vitamui.com/identity"
    serviceId: "^https://dev\\\\.vitamui\\\\.com/identity/.*|https://localhost/identity/.*"
  ui_portal:
    clientId: portal
    name: Portal Application
    base_url: "https://dev.vitamui.com"
    serviceId: "^https://dev\\\\.vitamui\\\\.com/.*|https://localhost/.*"
  ui_referential:
    clientId: referential
    name: Referential Application
    base_url: "https://dev.vitamui.com/referential"
    serviceId: "^https://dev\\\\.vitamui\\\\.com/referential/.*|https://localhost/referential/.*"
  ui_ingest:
    base_url: "https://dev.vitamui.com/ingest"
    serviceId: "^https://dev\\\\.vitamui\\\\.com/ingest/.*|https://localhost/ingest/.*"
  ui_archive_search:
    base_url: "https://dev.vitamui.com/archive-search"
    serviceId: "^https://dev\\\\.vitamui\\\\.com/archive-search/.*|https://localhost/archive-search/.*"
  ui_pastis:
    base_url: "https://dev.vitamui.com/pastis"
    serviceId: "^https://dev\\\\.vitamui\\\\.com/pastis/.*|https://localhost/pastis/.*"
  ui_collect:
    base_url: "https://dev.vitamui.com/collect"
    serviceId: "^https://dev\\\\.vitamui\\\\.com/collect/.*|https://localhost/collect/.*"
