name: vitamui-mongo-cluster
services:
  mongo-dev1:
    image: mongodb/mongodb-community-server:8.0.23-ubuntu2204
    container_name: vitamui-mongo1

    networks:
      - mongo-cluster

    ports:
      # 27018 is selected in order to avoid a conflict with Vitam docker instance
      - "27018:27018"
    volumes:
      # if you wish to setup additional user accounts specific per DB or with different roles you can use following entry point
      - "$PWD/mongo-entrypoint/:/scripts/mongo/data"
      - "$PWD/replica-set/:/scripts/mongo/replica-set"

    # no --auth is needed here as presence of username and password add this option automatically
    command: mongod --replSet "rs0" --port=27018

  mongo-dev2:
    image: mongodb/mongodb-community-server:8.0.23-ubuntu2204
    container_name: vitamui-mongo2

    networks:
      - mongo-cluster

    ports:
      - "27019:27019"
    volumes:
      # if you wish to setup additional user accounts specific per DB or with different roles you can use following entry point
      - "$PWD/mongo-entrypoint/:/scripts/mongo/data"
      - "$PWD/replica-set/:/scripts/mongo/replica-set"

    # no --auth is needed here as presence of username and password add this option automatically
    command: mongod --replSet "rs0" --port=27019

  mongo-dev3:
    image: mongodb/mongodb-community-server:8.0.23-ubuntu2204
    container_name: vitamui-mongo3

    networks:
      - mongo-cluster

    ports:
      - "27020:27020"
    volumes:
      # if you wish to setup additional user accounts specific per DB or with different roles you can use following entry point
      - "$PWD/mongo-entrypoint/:/scripts/mongo/data"
      - "$PWD/replica-set/:/scripts/mongo/replica-set"

    # no --auth is needed here as presence of username and password add this option automatically
    command: mongod --replSet "rs0" --port=27020

networks:
  mongo-cluster:
