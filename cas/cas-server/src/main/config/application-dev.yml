# Root: iam-client - Internal VITAM-UI IAM service client
iam-client:
  server-host: localhost
  server-port: 8083
  ssl-configuration:
    keystore:
      key-path: ../../dev-deployment/environments/keystores/vitamui-services/clients/keystore_cas-server.p12
      key-password: changeme
    truststore:
      key-path: ../../dev-deployment/environments/keystores/vitamui-services/truststore_vitamui-services.p12
      key-password: changeme

# Root: vitamui - Global VITAM-UI environment settings
vitamui:
  portal.url: https://dev.vitamui.com:4200/

cas_secret_token: tokcas_ie6UZsEcHIWrfv2x

# Root: opentracing - Jaeger distributed tracing
opentracing:
  jaeger:
    enabled: true
    logSpans: true
    expandExceptionLogs: true
    udp-sender:
      host: localhost
      port: 6831

# Root: logging - Logback and logging levels
logging:
  config: src/main/config/logback-dev.xml
  level:
    org.springframework:
      amqp: 'OFF'
      context.annotation: 'OFF'
      boot.devtools: 'OFF'
    org.apereo.inspektr.audit.support: 'INFO'
    org.springframework.webflow: INFO
    org.apereo: INFO

