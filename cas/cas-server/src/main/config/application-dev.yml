# Root: spring - Core Spring framework configurations (Cloud, Mail, Config, etc.)
spring:
  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false
        register: false
  # set port to 1025 for local development with MailHog container
  mail:
    host: localhost
    port: 2525
    username: no-reply@vitamui.com
    password: password
    testConnection: false
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Root: server - Web server configuration (Port, Context-path, SSL)
server:
  host: dev.vitamui.com
  port: 8080
  servlet:
    context-path: /cas
  ssl:
    key-store: ../../dev-deployment/environments/keystores/vitamui-services/servers/keystore_cas-server.p12
    key-store-password: changeme
    key-password: changeme
    enabled-protocols: TLSv1.2,TLSv1.3
    ciphers: ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384
    trust-store: ../../dev-deployment/environments/keystores/vitamui-services/truststore_vitamui-services.p12
    trust-store-password: changeme

# Root: management - Spring Boot Actuator endpoints and monitoring
management:
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: health,metrics,prometheus,info,status,configurationMetadata
  server:
    port: 7080
    ssl:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: false

