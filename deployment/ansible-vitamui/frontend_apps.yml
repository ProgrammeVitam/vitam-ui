---

- hosts: hosts_ui_*
  gather_facts: no
  any_errors_fatal: true
  roles:
    - assets_copy
    - nginx

# The single frontend application: the portal and every former application (identity, referential, ingest,
# archive-search, collect, pastis) as features. The hosts_ui_<app> groups of these applications are no longer used.
- hosts: hosts_ui_portal
  gather_facts: no
  any_errors_fatal: true
  roles:
    - nginx_webapp
  vars:
    vitamui_struct: "{{ vitamui.ui_portal }}"

# Relays the identity API of the admin zone (/identity-admin-api), with its own certificate.
- hosts: hosts_ui_identity_admin
  gather_facts: no
  any_errors_fatal: true
  roles:
    - nginx_webapp
  vars:
    vitamui_struct: "{{ vitamui.ui_identity_admin }}"

- hosts: hosts_ui_design_system
  gather_facts: no
  any_errors_fatal: true
  roles:
    - nginx_webapp
  vars:
    vitamui_struct: "{{ vitamui.ui_design_system }}"
