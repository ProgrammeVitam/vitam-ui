---

# Internal apps
- hosts: hosts_vitamui_security
  gather_facts: no
  any_errors_fatal: true
  roles:
    - vitamui
  vars:
    vitamui_struct: "{{ vitamui.security }}"
  tags: security

# External apps
- hosts: hosts_vitamui_iam
  gather_facts: no
  any_errors_fatal: true
  roles:
    - vitamui
  vars:
    vitamui_struct: "{{ vitamui.iam }}"
    vitam_cert: "{{ vitam_certs.vitamui }}"
  tags: iam

- hosts: hosts_cas_server
  gather_facts: no
  any_errors_fatal: true
  roles:
    - assets_copy
    - vitamui
  vars:
    vitamui_struct: "{{ vitamui.cas_server }}"
  tags: cas-server
