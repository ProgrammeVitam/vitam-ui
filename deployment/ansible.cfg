[defaults]
hash_behaviour = merge
roles_path     = ./roles/
filter_plugins = ./filter_plugins/
callbacks_enabled = timer, profile_tasks
gathering = smart
fact_caching_connection = environments/.facts_cache
fact_caching = jsonfile
forks = 20
timeout = 60
# Host keys of the target servers must be known (known_hosts) before deploying.
# Can be overridden with the ANSIBLE_HOST_KEY_CHECKING environment variable.
host_key_checking = True

[ssh_connection]
retries = 5
