---

- name: Delete docker package (obsolete & conflict with docker-ce)
  package:
    name: "docker"
    state: absent
  register: result
  retries: "{{ packages_install_retries_number }}"
  until: result is succeeded
  delay: "{{ packages_install_retries_delay }}"

- name: Install Docker repository prerequisites
  apt:
    name: ['ca-certificates','curl','gnupg','python3-apt']
    state: present
  register: result
  retries: "{{ packages_install_retries_number }}"
  until: result is succeeded
  delay: "{{ packages_install_retries_delay }}"

- name: Create APT keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download Docker repository signing key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'
  environment: "{{ {'http_proxy': http_proxy_environnement, 'https_proxy': http_proxy_environnement} if http_proxy_environnement | default('') | length > 0 else {} }}"
  register: result
  retries: "{{ packages_install_retries_number }}"
  until: result is succeeded
  delay: "{{ packages_install_retries_delay }}"

- name: install apt-transport-https as Docker repository is https
  package:
    name: apt-transport-https
    state: present
  register: result
  retries: "{{ packages_install_retries_number }}"
  until: result is succeeded
  delay: "{{ packages_install_retries_delay }}"

# Remove the entry created by earlier versions of this role before adding
# signed-by, otherwise APT rejects conflicting options for the same repository.
- name: Remove legacy Docker repository entry
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: absent
    update_cache: no

- name: check docker repo are present
  apt_repository:
    repo: "{{ item }}"
    state: present
  loop:
    - "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
  register: result
  retries: "{{ packages_install_retries_number }}"
  until: result is succeeded
  delay: "{{ packages_install_retries_delay }}"

- name: run apt-update
  apt:
    update_cache: yes
  register: result
  retries: "{{ packages_install_retries_number }}"
  until: result is succeeded
  delay: "{{ packages_install_retries_delay }}"

- name: installer docker & pip
  apt:
    name: ['docker-ce','python-pip']
    state: latest
  register: result
  retries: "{{ packages_install_retries_number }}"
  until: result is succeeded
  delay: "{{ packages_install_retries_delay }}"
  when: ansible_distribution_version | int == 10

- name: installer docker & pip3
  apt:
    name: ['docker-ce','python3-pip','python3-docker']
    state: latest
  register: result
  retries: "{{ packages_install_retries_number }}"
  until: result is succeeded
  delay: "{{ packages_install_retries_delay }}"
  when: ansible_distribution_major_version | int in [11, 12, 13]

- block:

  - name: upgrade pip & install docker python package
    pip:
      name: ['pip','docker']
      state: latest
    environment:
      http_proxy: "{{ http_proxy_environnement }}"
      https_proxy: "{{ http_proxy_environnement }}"
    when: http_proxy_environnement is defined and http_proxy_environnement != ""

  - name: upgrade pip & install docker python package
    pip:
      name: ['pip','docker']
      state: latest
    when: http_proxy_environnement is not defined or http_proxy_environnement == ""

  when: ansible_distribution_version | int < 11
