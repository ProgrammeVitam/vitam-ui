---

- name: Install nginx packages
  package:
    name:
      - nginx
      - "{{ 'libnginx-mod-stream' if ansible_os_family == 'Debian' else 'nginx-mod-stream' }}"
    state: latest
  register: result
  retries: "{{ packages_install_retries_number }}"
  until: result is succeeded
  delay: "{{ packages_install_retries_delay }}"

# Older Ansible DNF modules report success when a transaction error contains
# "already installed", even though none of the requested packages were installed.
# Retry this specific false success through the system CLI on AlmaLinux 10 only.
- name: Install nginx packages after a masked DNF transaction error on AlmaLinux 10
  command:
    argv:
      - dnf
      - --refresh
      - --assumeyes
      - install
      - nginx
      - nginx-mod-stream
  environment:
    LC_ALL: C
  register: nginx_cli_install
  changed_when: "'Nothing to do.' not in nginx_cli_install.stdout"
  retries: "{{ packages_install_retries_number }}"
  until: nginx_cli_install is succeeded
  delay: "{{ packages_install_retries_delay }}"
  when:
    - ansible_distribution == 'AlmaLinux'
    - ansible_distribution_major_version | int == 10
    - "'Package already installed: Transaction test error:' in (result.results | default([]) | join('\n'))"

- name: Create nginx folders
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ reverse_user }}"
    group: "{{ reverse_group }}"
    mode: "{{ vitamui_defaults.folder.folder_permission }}"
  with_items:
    - "{{ nginx_ssl_dir }}"
    - "{{ nginx_conf_dir }}"
    - "{{ nginx_tmp_dir }}"
    - "{{ nginx_log_dir }}"

- name: Configure nginx.conf
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    group: "{{ reverse_group }}"
    owner: "{{ reverse_user }}"
    mode: "{{ vitamui_defaults.folder.conf_permission }}"
  notify: reload nginx

- name: Configure proxy_params
  template:
    src: proxy_params.j2
    dest: "{{ nginx_conf_dir }}/proxy_params"
    group: "{{ reverse_group }}"
    owner: "{{ reverse_user }}"
    mode: "{{ vitamui_defaults.folder.conf_permission }}"
  notify: reload nginx

- name: Ensure nginx is started and at boot
  systemd:
    name: nginx
    enabled: "{{ reverse.at_boot | default(reverse_at_boot) }}"
    state: started
