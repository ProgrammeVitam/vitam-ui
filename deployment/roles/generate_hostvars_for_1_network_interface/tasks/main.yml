---

- name: Ensure host_vars directory exists
  local_action: file
    path={{ inventory_dir }}/host_vars
    state=directory
    mode=0750

- name: Check the collected address is an IPv4 address
  assert:
    that: ansible_default_ipv4.address is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
    fail_msg: "Unexpected value for ansible_default_ipv4.address on {{ inventory_hostname }}"

- name: Generate host_vars file for host
  local_action: template
     src=host-vars.j2
     dest={{ inventory_dir }}/host_vars/{{ inventory_hostname }}

