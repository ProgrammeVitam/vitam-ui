---

- name: Ensure host_vars directory exists
  local_action:
    module: file
    path: "{{ inventory_dir }}/host_vars"
    state: "directory"
    mode: "0750"

- name: Check the collected addresses are IPv4 addresses
  assert:
    that: item.ipv4.address | default('') is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
    fail_msg: "Unexpected IPv4 address on {{ inventory_hostname }}"
  loop: "{{ [ansible_eth0 | default(none), ansible_eth1 | default(none)] | select | list }}"
  loop_control:
    label: "{{ item.device | default('') }}"

- name: Add ip_service var to host_vars
  local_action:
    module: lineinfile
    create: yes
    path: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}"
    regexp: "ip_service"
    line: "{% if ansible_eth0 is defined %}ip_service: {{ ansible_eth0.ipv4.address }}{% endif %}"

- name: Add ip_admin var to host_vars
  local_action:
    module: lineinfile
    create: yes
    path: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}"
    regexp: "ip_admin"
    line: "{% if ansible_eth1 is defined %}ip_admin: {{ ansible_eth1.ipv4.address }}{% endif %}"
