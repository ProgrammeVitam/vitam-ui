---

- name: Set mongo connection & credentials
  set_fact:
    mongo_connection: "--host {{ ip_service }} --port {{ mongodb.mongod_port }} --quiet"
    mongo_credentials: "-u {{ mongodb.admin.user }} -p {{ mongodb.admin.password }}"
  no_log: "{{ hide_passwords_during_deploy }}"
  tags: update_mongodb_configuration

# Detect if authentication is enabled
- name: Verify if authent is enabled
  command: "mongosh {{ mongo_connection }} {{ mongo_credentials }} --eval 'db.help();'"
  register: mongo_authent_enabled
  failed_when: false
  no_log: "{{ hide_passwords_during_deploy }}"
  tags: update_mongodb_configuration

- name: Disable mongo credentials as authent is not enabled
  set_fact:
    mongo_credentials: ""
  when: mongo_authent_enabled.rc != 0
  tags: update_mongodb_configuration

# Activate security on mongo instances
- name: Activate security on mongod instances
  blockinfile:
    dest: "{{ mongod_config_path }}/mongod.conf"
    insertafter: EOF
    block: |
      security:
        authorization: enabled
        clusterAuthMode: keyFile
        keyFile: "{{ mongod_config_path }}/keyfile"
  tags: update_mongodb_configuration

# Restart the mongo instances (to enable auth)
# The play already runs on every replica set member, so each host restarts its
# own mongod: the previous delegate_to loop had every host restart every member,
# so each member was restarted as many times as there are members, all of them
# concurrently. As in the mongo role, "throttle: 1" keeps the sequence below
# exclusive to a single member, so the next one is only taken down once this one
# is serving again instead of losing the quorum.
- name: Restart vitamui-mongod service, one replica set member at a time
  throttle: 1
  tags: update_mongodb_configuration
  block:

    - name: Restart vitamui-mongod service
      service:
        name: vitamui-mongod
        enabled: "{{ mongodb.at_boot | default(service_at_boot) }}"
        state: restarted

    # Make sure the service is open (mongod listening on 27017)
    - name: "Wait for the service port {{ mongodb.mongod_port }} to be open"
      wait_for:
        host: "{{ ip_service }}"
        port: "{{ mongodb.mongod_port }}"
        timeout: "{{ vitamui_defaults.services.start_timeout }}"

    # db.hello() is answered before authentication, which matters here since the
    # restart is precisely what enables it.
    - name: Wait for the member to be back in the replica set
      command: >-
        mongosh --host {{ ip_service }} --port {{ mongodb.mongod_port }}
        --quiet --eval 'const member = db.hello();
        quit(member.isWritablePrimary || member.secondary || member.arbiterOnly ? 0 : 1)'
      register: mongod_member_state
      until: mongod_member_state.rc == 0
      retries: "{{ vitamui_defaults.services.status_retries_number | default(60) }}"
      delay: "{{ vitamui_defaults.services.status_retries_delay | default(5) }}"
      changed_when: false
