---

- name: Install mongodb-org-server package
  package:
    name:
      - mongodb-org-server
    state: present
  register: mongod_package
  retries: "{{ packages_install_retries_number }}"
  until: mongod_package is succeeded
  delay: "{{ packages_install_retries_delay }}"
  when: install_mode != "container"

- name: Disable mongod default service
  service:
    name: mongod
    state: stopped
    enabled: no
  when: install_mode != "container"

- name: get passwd for vitamuidb
  getent:
    database: passwd
    key: "{{ vitamui_defaults.users.vitamuidb | default('vitamuidb') }}"

- name: Deploy systemd service file for vitamui-mongod
  template:
    src: "vitamui-{{ 'container-' if install_mode == 'container' else '' }}mongod.service.j2"
    dest: "{{ '/lib/systemd/system' if ansible_os_family == 'Debian' else '/usr/lib/systemd/system' }}/vitamui-mongod.service"
    owner: root
    group: root
    mode: "0644"
  register: mongod_service_file

#### Configuration ####

- name: Check that the directories exists (must be removed when the RPM plugin will be patched)
  file:
    path: "{{ vitamui_defaults.folder.root_path | default('/vitamui') }}/{{ item }}/mongod"
    state: directory
    owner: "{{ vitamui_defaults.users.vitamuidb | default('vitamuidb') }}"
    group: "{{ vitamui_defaults.users.group | default('vitamui') }}"
    mode: "{{ '0777' if install_mode == 'container' else vitam_defaults.folder.folder_permission }}"
  with_items:
    - app
    - bin
    - conf
    - data
    - lib
    - log
    - script
    - tmp
  register: mongod_directories
  tags: update_mongodb_configuration

- name: Create db directory
  file:
    path: "{{ mongo_db_path }}"
    state: directory
    owner: "{{ vitamui_defaults.users.vitamuidb | default('vitamuidb') }}"
    group: "{{ vitamui_defaults.users.group | default('vitamui') }}"
    mode: "{{ '0777' if install_mode == 'container' else vitam_defaults.folder.folder_permission }}"
  register: mongod_db_directory
  tags: update_mongodb_configuration

# mongod.conf declares no sharding.clusterRole: a node holding a shardIdentity
# document would refuse to restart, so catch it before writing the configuration.
- name: Check whether this node already holds MongoDB data
  stat:
    path: "{{ mongod_effective_db_path }}/WiredTiger"
  register: mongod_data_directory
  tags: update_mongodb_configuration

# Arbiters hold no users nor data: the lookup would be refused and is pointless.
- name: Look for a leftover shardIdentity document
  command: >-
    mongosh {{ ip_service }}:{{ mongodb.mongod_port }}/admin
    -u {{ mongodb.admin.user }} -p {{ mongodb.admin.password }} --quiet
    --eval 'print("VITAMUI_SHARD_IDENTITY=" + (db.system.version.findOne({_id: "shardIdentity"}) ? 1 : 0))'
  register: mongod_shard_identity
  no_log: "{{ hide_passwords_during_deploy }}"
  failed_when: false
  changed_when: false
  when: not (mongo_arbiter | default(false) | bool)
  tags: update_mongodb_configuration

# The admin user may not exist yet (first installation interrupted before local-user.js):
# the lookup also passes without credentials while client authentication is not enforced.
- name: Look for a leftover shardIdentity document, without credentials
  command: >-
    mongosh {{ ip_service }}:{{ mongodb.mongod_port }}/admin --quiet
    --eval 'print("VITAMUI_SHARD_IDENTITY=" + (db.system.version.findOne({_id: "shardIdentity"}) ? 1 : 0))'
  register: mongod_shard_identity_without_credentials
  failed_when: false
  changed_when: false
  when:
    - not (mongo_arbiter | default(false) | bool)
    - mongod_shard_identity.stdout | default('') is not search('VITAMUI_SHARD_IDENTITY=')
  tags: update_mongodb_configuration

- name: Gather the shardIdentity lookup result
  set_fact:
    mongod_shard_identity_result: "{{ mongod_shard_identity.stdout | default('') }} {{ mongod_shard_identity_without_credentials.stdout | default('') }}"
  tags: update_mongodb_configuration

- name: Fail when a shardIdentity document would keep mongod from restarting
  fail:
    msg: >-
      admin.system.version holds a shardIdentity document on this node, and the
      mongod configuration deployed by VitamUI declares no sharding.clusterRole:
      mongod would refuse to start on the next restart. Check first that this
      replica set really is not a shard of a sharded cluster, then drop the
      document with: mongosh {{ ip_service }}:{{ mongodb.mongod_port }}/admin
      -u <admin> --eval 'db.system.version.deleteOne({_id: "shardIdentity"})'
  when: mongod_shard_identity_result is search('VITAMUI_SHARD_IDENTITY=[1-9]')
  tags: update_mongodb_configuration

# A fresh node cannot be read yet and has nothing to check; a node holding data must be checked.
- name: Fail when the shardIdentity check could not run on a node holding data
  fail:
    msg: >-
      This node already holds MongoDB data but admin.system.version could not be
      read, so the shardIdentity check did not run: mongod is down, or the admin
      credentials were refused while client authentication is enforced. The
      configuration deployed by VitamUI declares no
      sharding.clusterRole, and a node carrying a shardIdentity document would
      only refuse to start once that configuration is in place. Start mongod and
      run the deployment again, or check the node by hand with: mongosh
      {{ ip_service }}:{{ mongodb.mongod_port }}/admin -u <admin> --eval
      'db.system.version.findOne({_id: "shardIdentity"})' then re-run with
      -e mongod_skip_shard_identity_check=true once it answers null.
  when:
    - not (mongo_arbiter | default(false) | bool)
    - mongod_data_directory.stat.exists
    - mongod_shard_identity_result is not search('VITAMUI_SHARD_IDENTITY=')
    - not (mongod_skip_shard_identity_check | default(false) | bool)
  tags: update_mongodb_configuration

# mongod.conf references the keyfile: it must be there before mongod starts.
- name: Copy the passphrase
  template:
    src: keyfile.j2
    dest: "{{ mongo_config_path }}/keyfile"
    owner: "{{ vitamui_defaults.users.vitamuidb | default('vitamuidb') }}"
    group: "{{ vitamui_defaults.users.group | default('vitamui') }}"
    mode: 0600
  register: mongod_keyfile
  tags: update_mongodb_configuration

- name: Create the mongod configuration server file
  template:
    src: mongod.conf.j2
    dest: "{{ mongo_config_path }}/mongod.conf"
    owner: "{{ vitamui_defaults.users.vitamuidb | default('vitamuidb') }}"
    group: "{{ vitamui_defaults.users.group | default('vitamui') }}"
    mode: "{{ '0444' if install_mode == 'container' else vitam_defaults.folder.conf_permission }}"
  register: mongod_configuration
  tags: update_mongodb_configuration

- name: Enable logrotate for vitamui-mongod
  template:
    src: logrotate.j2
    dest: /etc/logrotate.d/vitamui-mongod
    owner: root
    group: root
    mode: 0644
  when: mongodb.logrotate | default('enabled') | lower == 'enabled'

- name: Disable logrotate for vitamui-mongod
  file:
    path: /etc/logrotate.d/vitamui-mongod
    state: absent
  when: mongodb.logrotate | default('enabled') | lower == 'disabled'

#### Consul configuration ####

- name: Ensure consul config dir is OK
  file:
    path: "{{ consul.conf_folder | default('/vitam/conf/consul') }}"
    owner: "{{ vitamui_defaults.users.vitamui | default('vitamui') }}"
    group: "{{ vitamui_defaults.users.group | default('vitamui') }}"
    mode: "{{ '0777' if install_mode == 'container' else vitam_defaults.folder.folder_permission }}"
    state: directory
  tags:
    - consul_conf
    - update_mongodb_configuration

- name: Deploy consul agent service declaration
  template:
    src: "service-componentid.json.j2"
    dest: "{{ consul.conf_folder | default('/vitam/conf/consul') }}/service-mongod.json"
    owner: "{{ vitamui_defaults.users.vitamui | default('vitamui') }}"
    group: "{{ vitamui_defaults.users.group | default('vitamui') }}"
    mode: "{{ '0777' if install_mode == 'container' else vitam_defaults.folder.conf_permission }}"
  tags:
    - consul_conf
    - update_mongodb_configuration
  notify: "mongo - reload consul configuration"

# Ensure that the installation is complete and consul up before contnuing...
- meta: flush_handlers
  tags:
    - consul_conf
    - update_mongodb_configuration

#### Rolling restart ####
# One member at a time, to keep the replica set quorum.

# mongod_package and mongod_service_file are untagged, hence undefined under --tags.
- name: Check whether vitamui-mongod must be restarted
  set_fact:
    mongod_restart_required: >-
      {{ (mongod_package is defined and mongod_package is changed)
         or (mongod_service_file is defined and mongod_service_file is changed)
         or mongod_directories is changed
         or mongod_db_directory is changed
         or mongod_keyfile is changed
         or mongod_configuration is changed }}
  tags: update_mongodb_configuration

# Secondaries first, primary last: a single election during the rolling restart.
- name: Look for the replica set primary
  command: >-
    mongosh --host {{ hostvars[item]['ip_service'] }} --port {{ mongodb.mongod_port }}
    --quiet --eval 'print(db.hello().isWritablePrimary === true)'
  delegate_to: "{{ item }}"
  loop: "{{ groups['hosts_vitamui_mongod'] }}"
  register: mongod_hello
  failed_when: false
  changed_when: false
  run_once: true
  tags: update_mongodb_configuration

- name: Restart vitamui-mongod, one replica set member at a time
  include_tasks:
    file: rolling_restart.yml
    # apply: propagate the tag to the included tasks
    apply:
      tags: update_mongodb_configuration
  vars:
    mongod_member_restart_required: "{{ hostvars[mongod_member]['mongod_restart_required'] | default(false) | bool }}"
    mongod_primary_members: "{{ mongod_hello.results | selectattr('stdout', 'defined') | selectattr('stdout', 'equalto', 'true') | map(attribute='item') | list }}"
  loop: "{{ groups['hosts_vitamui_mongod'] | reject('in', mongod_primary_members) | list + mongod_primary_members }}"
  loop_control:
    loop_var: mongod_member
  run_once: true
  tags: update_mongodb_configuration

- name: Ensure vitamui-mongod is started
  service:
    name: vitamui-mongod
    state: started
    enabled: "{{ mongodb.at_boot | default(service_at_boot) }}"
  tags: update_mongodb_configuration

- name: Wait for the vitamui-mongod port to be open
  wait_for:
    host: "{{ ip_service }}"
    port: "{{ mongodb.mongod_port }}"
    timeout: "{{ vitamui_defaults.services.start_timeout }}"

- name: Check vitamui-mongod service health in local consul agent
  uri:
    url: "http://{{ (inventory_hostname in groups['hosts_vitamui_consul_server'] or inventory_hostname in groups['hosts_consul_server']) | ternary(hostvars[inventory_hostname]['ip_admin'], '127.0.0.1') }}:8500/v1/agent/health/service/name/mongo-vitamui-mongod"
  register: result
  until:
    - result.status is defined
    - result.status == 200
  retries: "{{ vitamui_defaults.services.status_retries_number | default(60) }}"
  delay: "{{ vitamui_defaults.services.status_retries_delay | default(5) }}"

#### Mongo online configuration ####
# Note : mongodb needs to be started for these elements to succeed

# # Now let's initiate the replica set
# # Do this only on the first node of the current shard
# # We have to wait for all the node to be up

- block:

    - fail:
        msg: "ERROR: mongo_rs_bootstrap node can't be mongo_arbiter !"
      when: mongo_arbiter | default(false) | bool == true
      tags: update_mongodb_configuration

    - name: Wait for the service port to be open on all members of the replica
      wait_for:
        host: "{{ hostvars[item]['ip_service'] }}"
        port: "{{ mongodb.mongod_port }}"
        timeout: "{{ vitamui_defaults.services.start_timeout }}"
      with_items: "{{ groups['hosts_vitamui_mongod'] }}"
      tags: update_mongodb_configuration

    - name: Copy the script which initiate the replica set
      template:
        src: init-replica.js.j2
        dest: "{{ vitamui_defaults.folder.root_path | default('/vitamui') }}/app/mongod/init-replica.js"
        owner: "{{ vitamui_defaults.users.vitamuidb | default('vitamuidb') }}"
        group: "{{ vitamui_defaults.users.group | default('vitamui') }}"
        mode: "{{ vitamui_defaults.folder.conf_permission | default('0440') }}"
      tags: update_mongodb_configuration

    - name: Initiate the replica set
      command: "mongosh --host {{ ip_service }} --port {{ mongodb.mongod_port }} --quiet --file {{ vitamui_defaults.folder.root_path | default('/vitamui') }}/app/mongod/init-replica.js"
      tags: update_mongodb_configuration

    - import_tasks: check_auth.yml

    # Create the local shard admin user
    - name: Unset mongo_nodes fact
      set_fact:
        mongo_nodes: []

    - name: Compute list of mongo_nodes
      set_fact:
        mongo_nodes: "{{ mongo_nodes + [ hostvars[item]['ip_service'] + ':' + mongodb.mongod_port | string ] }}"
      loop: "{{ groups['hosts_vitamui_mongod'] }}"
      when: not hostvars[item]['mongo_arbiter'] | default(false) | bool

    - name: Copy the script which create the local users
      template:
        src: local-user.js.j2
        dest: "{{ vitamui_defaults.folder.root_path | default('/vitamui') }}/app/mongod/local-user.js"
        owner: "{{ vitamui_defaults.users.vitamuidb | default('vitamuidb') }}"
        group: "{{ vitamui_defaults.users.group | default('vitamui') }}"
        mode: "{{ vitamui_defaults.folder.conf_permission | default('0440') }}"
      tags: update_mongodb_configuration

    - name: Create the local shard user
      command: "mongosh --host {{ mongo_nodes | join(',') }} {{ mongo_credentials }} --quiet --file {{ vitamui_defaults.folder.root_path | default('/vitamui') }}/app/mongod/local-user.js"
      tags: update_mongodb_configuration

  when: mongo_rs_bootstrap | default(false) | bool == true
