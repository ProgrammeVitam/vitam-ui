---

- include_role:
    name: nginx

- name: 'Adding vitamui vhost configuration'
  template:
    src: "nginx/conf.d/{{ item }}.j2"
    dest: "{{ nginx_conf_dir }}/{{ item }}"
    group: "{{ reverse_group }}"
    owner: "{{ reverse_user }}"
    mode: "{{ vitamui_defaults.folder.conf_permission }}"
  with_items:
    - upstream
    - vhosts.conf
  notify: reload nginx

- name: 'Tasks > reverse > configure_nginx.yml | Put ssl conf'
  template:
    src: "nginx/ssl/{{ item }}.j2"
    dest: "{{ nginx_ssl_dir }}/{{ item }}"
    group: "{{ reverse_group }}"
    owner: "{{ reverse_user }}"
    mode: "{{ vitamui_defaults.folder.conf_permission }}"
  with_items:
    - ssl.conf
    - reverse.key_pass
    - reverse.crt
    - reverse.key
    - dhparam.pem
  notify: reload nginx
  when: vitamui_reverse_external_protocol | lower == 'https'

- include_tasks: maintenance_page.yml
  when: maintenance_enabled | default(false) | bool

- name: Ensure nginx is started
  systemd:
    name: nginx
    state: started
