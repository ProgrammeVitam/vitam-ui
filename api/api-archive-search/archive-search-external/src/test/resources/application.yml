spring:
  api:
    name: API Archive externe - Gestion des archives
    description: API externe de gestion des archives
    version: v1
  cloud:
    bus:
      enabled: false
    discovery:
      enabled: false
    consul:
      enabled: false
      config:
        enabled: false

archive-search-external:
  security-client:
    server-host: localhost
    server-port: 8089
    secure: false
  iam-internal-client:
    server-host: localhost
    server-port: 7083
    secure: false


swagger:
  layer: api-external
  
# external ontologie file path
ontologies_file_path: "src/test/resources/ontologies/external_ontology_fields.json"
