spring:
  api:
    name: API Archive externe - Gestion des archives
    description: API externe de gestion des archives
    version: v1
  cloud:
    bus:
      enabled: false
    discovery:
      enabled: false
    consul:
      enabled: false
      config:
        enabled: false

archive-search:
  security-client:
    server-host: localhost
    server-port: 8089
    secure: false
  iam-client:
    server-host: localhost
    server-port: 8083
    secure: true
    ssl-configuration:
      truststore:
        key-path: ../../../dev-deployment/environments/keystores/vitamui-services/truststore_vitamui.jks
        key-password: changeme
      keystore:
        key-path: ../../../dev-deployment/environments/keystores/vitamui-services/server/archive-search/keystore_archive-search.jks
        key-password: changeme
        type: JKS
      hostname-verification: false

swagger:
  layer: api-external

# external ontologie file path
ontologies_file_path: "src/test/resources/ontologies/external_ontology_fields.json"
