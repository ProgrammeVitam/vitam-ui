# TECHNICAL PROPERTIES / DON'T put environment properties
# This property can be override by a config file give at run time with spring.config.location

spring:
  application:
    name: referential-external
  api:
    name: API Referential External
    description: This API is used to manage Vitam's referentiel
    version: v1
  mvc:
    favicon:
      enabled : false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jmx:
    unique-names: true

management:
  endpoints:
    jmx:
      domain: referential-external
      web.exposure.include: info,health,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

swagger:
 layer: api-external
 file-path: file:../../../tools/swagger/docs/api-external/referential-external/swagger.json


# internal ontology file path
internal_ontology_file_path: "src/main/resources/internal-ontology/internal_ontology_fields.json"
