debug: false

spring:
  config:
    use-legacy-processing: true
  cloud:
    consul: #disabled for dev
      enabled: false
      discovery:
        enabled: false
        register: false
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
cas.tenant.identifier: -1
server:
  host:
  port: 8087
  tomcat.connection-timeout: 60000
  ssl:
    key-store: ../../../dev-deployment/environments/keystores/server/localhost/keystore_referential.jks
    key-store-password: changeme
    key-password: changeme
    trust-store: ../../../dev-deployment/environments/keystores/server/truststore_server.jks
    trust-store-password: changeme
    client-auth: want
    enabled-protocols: TLSv1.2,TLSv1.3
    ciphers: ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384
    client-certificate-header-name: x-ssl-cert
  error:
    path: /error

management:
  server:
    address: localhost
    port: 8187
    ssl:
      enabled: false

referential:
  security-client:
    server-host: localhost
    server-port: 8084
    secure: false
  iam-client:
    server-host: localhost
    server-port: 8083
    secure: true
    ssl-configuration:
      truststore:
        key-path: ../../../dev-deployment/environments/keystores/server/truststore_server.jks
        key-password: changeme
      keystore:
        key-path: ../../../dev-deployment/environments/keystores/server/localhost/keystore_referential.jks
        key-password: changeme
        type: JKS
      hostname-verification: false
  external-archiving-system-clients:
    # - archiving-system-id: MyExternalEnv
    #   name: "MY EXTERNAL ENV NAME"
    #   access-external-client:
    #     server-host: access-external-host
    #     server-port: 443
    #     secure: true
    #     ssl-configuration:
    #       keystore:
    #         key-path: external.p12
    #         key-password: changeit
    #       truststore:
    #         key-path: cacerts
    #         key-password: changeit
  external-archiving-system-tenants:
    - tenant: 1
      external-archiving-system-references:
        # Use "local" archiving-system-id for current Vitam instance
        # Current tenant (1) is implicit. No need to add it to tenantIds.
        - archiving-system-id: local
          tenantIds: [2, 3, 4]
        # - archiving-system-id: MyExternalEnv
        #   tenantIds: [0, 1]

# Jaeger
opentracing:
  jaeger:
    enabled: true
    logSpans: true
    expandExceptionLogs: true
    udp-sender:
      host: localhost
      port: 6831

logging:
  level:
    fr.gouv.vitamui: DEBUG
    fr.gouv.vitamui.iam.security: DEBUG
    #level.org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
