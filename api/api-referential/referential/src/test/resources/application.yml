spring:
  config:
    name: referential-application
  api:
    name: API Referential - Gestion des référentiels
    description: Ces APIS sont utilisés pour configurer les référentiels
    version: v1
  cloud:
    bus:
      enabled: false
    discovery:
      enabled: false
    consul:
      enabled: false
      config:
        enabled: false

referential:
  security-client:
    server-host: localhost
    server-port: 8084
    secure: false
  iam-client:
    server-host: localhost
    server-port: 8083
    secure: true
    ssl-configuration:
      truststore:
        key-path: ../../../dev-deployment/environments/keystores/server/truststore_server.jks
        key-password: changeme
      keystore:
        key-path: ../../../dev-deployment/environments/keystores/server/localhost/keystore_archive-search.jks
        key-password: changeme
        type: JKS
      hostname-verification: false

swagger:
  layer: api-external

login.url: http://cas/login

security:
  host: xxx
  port: 8080

logbook.scheduling.sendEventToVitamTasks.enabled: false

# internal ontology fields file path
internal_ontology_file_path: "src/test/resources/internal-ontology/internal_ontology_fields.json"

#logging.level.org.springframework: DEBUG
