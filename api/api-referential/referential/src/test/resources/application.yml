spring:
  config:
    name: referential-application
  api:
    name: API Referential - Gestion des référentiels
    description: Ces APIS sont utilisés pour configurer les référentiels
    version: v1
  cloud:
    bus:
      enabled: false
    discovery:
      enabled: false
    consul:
      enabled: false
      config:
        enabled: false

referential:
  security-client:
    server-host: localhost
    server-port: 8084
    secure: false
  iam-client:
    server-host: localhost
    server-port: 8083
    secure: true
    ssl-configuration:
      truststore:
        key-path: ../../../dev-deployment/environments/keystores/vitamui-services/truststore_vitamui.jks
        key-password: changeme
      keystore:
        key-path: ../../../dev-deployment/environments/keystores/vitamui-services/server/archive-search/keystore_archive-search.jks
        key-password: changeme
        type: JKS
      hostname-verification: false

  external-archiving-system-clients:
  # - archiving-system-id: MyExternalEnv
  #   name: "MY EXTERNAL ENV NAME"
  #   access-external-client:
  #     server-host: <host>
  #     server-port: <port>
  #     secure: true
  #     ssl-configuration:
  #       keystore:
  #         key-path: <path/to/keystore.p12>
  #         key-password: <keystore_password>
  #       truststore:
  #         key-path:  <path/to/keystore.jks>
  #         key-password: <truststore_password>
  external-archiving-system-tenants:
    - tenant: 1
      external-archiving-system-references:
        - archiving-system-id: local
          tenantIds: [2, 3, 4]

swagger:
  layer: api-external

login.url: http://cas/login

security:
  host: xxx
  port: 8080

logbook.scheduling.sendEventToVitamTasks.enabled: false

# internal ontology fields file path
internal_ontology_file_path: "src/test/resources/internal-ontology/internal_ontology_fields.json"

#logging.level.org.springframework: DEBUG
