spring:
  api:
    name: API Ingest externe - Gestion des ingests
    description: API externe de gestion des ingests
    version: v1
  cloud:
    bus:
      enabled: false
    discovery:
      enabled: false
    consul:
      enabled: false
      config:
        enabled: false

ingest-external:
  security-client:
    server-host: localhost
    server-port: 8084
    secure: false
  iam-internal-client:
    server-host: localhost
    server-port: 7083
    secure: false

swagger:
  layer: api-external


tmp_folder_path: "src/main/resources"

logbook.scheduling.sendEventToVitamTasks.enabled: false
