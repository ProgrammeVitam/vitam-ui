debug: false

spring:
  config:
    use-legacy-processing: true
  profiles:
    active: dev, swagger

  cloud:
    consul: #disabled for dev
      enabled: false
      discovery:
        enabled: false
        register: false

server:
  host:
  port: 8088
  ssl:
    key-store: ../../../dev-deployment/environments/keystores/server/localhost/keystore_ingest.jks
    key-store-password: changeme
    key-password: changeme
    trust-store: ../../../dev-deployment/environments/keystores/server/truststore_server.jks
    trust-store-password: changeme
    client-auth: need
    enabled-protocols: TLSv1.2,TLSv1.3
    ciphers: ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384

management:
  server:
    address: localhost
    port: 8188
    ssl:
      enabled: false

ingest:
  security-client:
    server-host: localhost
    server-port: 8084
    secure: false
  iam-client:
    server-host: localhost
    server-port: 8083
    secure: true
    ssl-configuration:
      truststore:
        key-path: ../../../dev-deployment/environments/keystores/server/truststore_server.jks
        key-password: changeme
      keystore:
        key-path: ../../../dev-deployment/environments/keystores/server/localhost/keystore_ingest.jks
        key-password: changeme
        type: JKS
      hostname-verification: false

# Jaeger
opentracing:
  jaeger:
    enabled: true
    logSpans: true
    expandExceptionLogs: true
    udp-sender:
      host: localhost
      port: 6831

logging:
  level:
    fr.gouv.vitamui: DEBUG
    fr.gouv.vitamui.iam.security: DEBUG
    #level.org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

---
spring:
  config:
    activate:
      on-profile: gateway

gateway:
  enabled: true

server:
  ssl:
    client-auth: want
    client-certificate-header-name: x-ssl-cert

tmp_folder_path: "src/main/resources"
