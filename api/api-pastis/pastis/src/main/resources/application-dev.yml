debug: false
# Pastis Rest APi
rng:
  base:
    file: profiles_new/Profil_seda_pastis_mvp.rng
    directory: rng/
json:
  base:
    file: profiles_new/ProfileJson.json
  template:
    fileStandalone: profiles_new/AUP_default_PASTIS.json
    fileVitam: profiles_new/AUP_default_VITAM.json
pua:
  definitions:
    file: pua_validation/ProfileJson.json

spring:
  config:
    use-legacy-processing: true

  cloud:
    consul: #disabled for dev
      enabled: false
      discovery:
        enabled: false
        register: false

multipart:
  enabled: true

spring.servlet.multipart.max-file-size: -1
spring.servlet.multipart.max-request-size: -1
cas.tenant.identifier: -1
server:
  host:
  port: 8015
  ssl:
    key-store: ../../../dev-deployment/environments/keystores/vitamui-services/servers/keystore_pastis.p12
    key-store-password: changeme
    key-password: changeme
    trust-store: ../../../dev-deployment/environments/keystores/vitamui-services/truststore_vitamui-services.p12
    trust-store-password: changeme
    client-auth: want
    enabled-protocols: TLSv1.1,TLSv1.2,TLSv1.3
    ciphers: ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384
    client-certificate-header-name: x-ssl-cert

management:
  server:
    address: localhost
    port: 8191
    ssl:
      enabled: false
pastis:
  security-client:
    server-host: localhost
    server-port: 8084
    secure: false
  iam-client:
    server-host: localhost
    server-port: 8083
    secure: true
    ssl-configuration:
      truststore:
        key-path: ../../../dev-deployment/environments/keystores/vitamui-services/truststore_vitamui-services.p12
        key-password: changeme
      keystore:
        key-path: ../../../dev-deployment/environments/keystores/vitamui-services/clients/keystore_pastis.p12
        key-password: changeme
      hostname-verification: false

# Jaeger
opentracing:
  jaeger:
    enabled: true
    logSpans: true
    expandExceptionLogs: true
    udp-sender:
      host: localhost
      port: 6831

logging:
  level:
    fr.gouv.vitamui: DEBUG
    fr.gouv.vitamui.iam.security: DEBUG
    #level.org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
cors.allowed-origins: https://dev.vitamui.com,https://localhost
