server:
  port: 9443
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: classpath:certs/dev-vitamui.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-alias: dev-vitamui
  servlet:
    session:
      cookie:
        # Cookies do NOT scope by port — a JSESSIONID emitted by ng serve on :4200 (or any other
        # servlet on dev.vitamui.com) would overwrite ours and break SSO. Use a distinct name.
        name: SAS_JSESSIONID
        secure: true
        http-only: true
        # SAML POST binding: the IdP posts the SAMLResponse cross-site to /login/saml2/sso/**;
        # SameSite=lax would strip the session cookie on that POST → Spring loses the AuthnRequest
        # and rejects the response with `invalid_in_response_to`. `none` requires Secure=true (OK,
        # we're on HTTPS 9443).
        same-site: none

spring:
  application:
    name: auth-server
  thymeleaf:
    enabled: false
  # Boot 4 moved connection props from `spring.data.mongodb.*` to `spring.mongodb.*` (the former are
  # kept only as deprecated aliases). `spring.data.mongodb.*` still hosts the ODM/repository settings
  # (auto-index-creation, gridfs, representation).
  mongodb:
    # Dedicated auth-server database on the same Mongo instance as IAM (dev). Requires a user created
    # once via mongosh — see README.md § Bootstrap. Override entirely with AUTH_SERVER_MONGO_URI in
    # staging/prod. directConnection=true bypasses replica-set topology discovery: the dev container's
    # rs0 advertises itself as `vitamui-mongo:27018`, which isn't resolvable from the host; without it
    # the Java Mongo driver reconnects to that hostname and times out.
    uri: ${AUTH_SERVER_MONGO_URI:mongodb://mongod_dbuser_authserver:mongod_dbpwd_authserver@localhost:27018/auth-server?connectTimeoutMS=2000&directConnection=true}
  ssl:
    bundle:
      jks:
        # mTLS bundle for outgoing calls to IAM. The keystore identifies this auth-server (CN=cas-server,
        # inherited from the historical CAS slot in the vitamui-services PKI); the truststore validates
        # IAM's server certificate. Referenced from `vitamui.auth-server.iam.ssl-bundle`.
        iam-mtls:
          keystore:
            location: classpath:certs/keystore_auth-server.p12
            password: ${IAM_MTLS_KEYSTORE_PASSWORD:changeme}
            type: PKCS12
          truststore:
            location: classpath:certs/truststore_vitamui-services.p12
            password: ${IAM_MTLS_TRUSTSTORE_PASSWORD:changeme}
            type: PKCS12

# Diagnostic logs for the cross-app SSO issue. Set the block to WARN once SSO works.
logging:
  level:
    org.springframework.security.web.context.HttpSessionSecurityContextRepository: TRACE
    org.springframework.security.web.access: DEBUG
    org.springframework.security.web.authentication.logout: DEBUG
    org.springframework.security.oauth2.server.authorization: TRACE
    org.springframework.session: DEBUG
    org.springframework.security.saml2: TRACE
    org.springframework.security.web.authentication: DEBUG

vitam:
  security:
    jwt:
      public-key-path: classpath:certs/public.pem
      private-key-path: classpath:certs/private.pem

vitamui:
  auth-server:
    # The issuer must exactly match the URL the browser uses to reach the auth-server, otherwise
    # angular-oauth2-oidc rejects the discovery document with "issuer mismatch".
    issuer: ${AUTH_SERVER_ISSUER:https://dev.vitamui.com:9443}
    iam:
      base-url: ${IAM_BASE_URL:https://localhost:8083}
      # mTLS bundle configured under `spring.ssl.bundle.jks.iam-mtls` (see above). When set, the RestClient
      # presents a client cert to IAM and validates IAM's cert against the shared vitamui-services truststore.
      ssl-bundle: ${IAM_SSL_BUNDLE:iam-mtls}
      # Dev-only fallback: only used when ssl-bundle is empty. Keep off by default now that mTLS is wired.
      trust-all-certs: ${IAM_TRUST_ALL_CERTS:false}
      # Skips hostname verification on the mTLS handshake. The dev cert has CN=iam while the URL host is
      # localhost/dev.vitamui.com, so verification would fail. Never true in staging/prod.
      disable-hostname-verification: ${IAM_DISABLE_HOSTNAME_VERIFICATION:true}
      internal-application-id: auth-server
    # The 8 vitam-ui OIDC clients. redirect-uris and post-logout-redirect-uris accept multiple values
    # so both dev.vitamui.com and localhost work.
    clients:
      - client-id: portal
        redirect-uris:
          - https://dev.vitamui.com:4200/
          - http://localhost:4200/
        post-logout-redirect-uris:
          - https://dev.vitamui.com:4200/
          - http://localhost:4200/
      - client-id: identity
        redirect-uris:
          - https://dev.vitamui.com:4201/user
          - https://dev.vitamui.com:4201/
        post-logout-redirect-uris:
          - https://dev.vitamui.com:4201/user
          - https://dev.vitamui.com:4201/
      - client-id: identityadmin
        redirect-uris:
          - https://dev.vitamui.com:4201/customer
          - https://dev.vitamui.com:4201/
        post-logout-redirect-uris:
          - https://dev.vitamui.com:4201/customer
          - https://dev.vitamui.com:4201/
      - client-id: referential
        redirect-uris:
          - https://dev.vitamui.com:4202/ingest-contract
          - https://dev.vitamui.com:4202/
        post-logout-redirect-uris:
          - https://dev.vitamui.com:4202/ingest-contract
          - https://dev.vitamui.com:4202/
      - client-id: ingest
        redirect-uris:
          - https://dev.vitamui.com:4208/ingest
          - https://dev.vitamui.com:4208/
        post-logout-redirect-uris:
          - https://dev.vitamui.com:4208/ingest
          - https://dev.vitamui.com:4208/
      - client-id: archive-search
        redirect-uris:
          - https://dev.vitamui.com:4209/archive-search
          - https://dev.vitamui.com:4209/
        post-logout-redirect-uris:
          - https://dev.vitamui.com:4209/archive-search
          - https://dev.vitamui.com:4209/
      - client-id: collect
        redirect-uris:
          - https://dev.vitamui.com:4210/collect
          - https://dev.vitamui.com:4210/
        post-logout-redirect-uris:
          - https://dev.vitamui.com:4210/collect
          - https://dev.vitamui.com:4210/
      - client-id: pastis
        redirect-uris:
          - https://dev.vitamui.com:4251/pastis
          - https://dev.vitamui.com:4251/
        post-logout-redirect-uris:
          - https://dev.vitamui.com:4251/pastis
          - https://dev.vitamui.com:4251/
    token:
      access-token-ttl-minutes: 240
    # CORS origins allowed to call the OIDC endpoints and login JSON API from a browser.
    # Comma-separated list; wildcard patterns are supported.
    # dev.vitamui.com uses ports 4200 (portal), 4201 (identity/identity-admin), 4202 (referential),
    # 4208 (ingest), 4209 (archive-search), 4210 (collect), 4251 (pastis).
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://dev.vitamui.com:*,http://localhost:*}
