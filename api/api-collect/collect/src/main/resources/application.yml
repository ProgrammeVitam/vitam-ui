# TECHNICAL PROPERTIES / DON'T put environment properties
# This property can be override by a config file give  at run time with spring.config.location

spring:
  application:
    name: collect
  api:
    name: API Collect
    description: This API is used to collect archives
    version: v1

  jmx:
    unique-names: true

management:
  endpoints:
    jmx:
      domain: collect
    web.exposure.include: info,health,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

metrics:
  reporterInterval: 1
  reporterIntervalUnit: MINUTES
  index: metrics-vitam-jvm

gateway:
  enabled: true

#Bug #16651: per-collection fields for which sorting is disabled (analyzed fields whose sort is too costly at high volume)
query:
  non-sortable-fields:
    Unit:
      - Title
