debug: false

spring:
  config:
    use-legacy-processing: true

  cloud:
    consul: #disabled for dev
      enabled: false
      discovery:
        enabled: false
        register: false

  data:
    mongodb:
      uri: mongodb://mongod_dbuser_archivesearch:mongod_dbpwd_archivesearch@localhost:27018/archivesearch?connectTimeoutMS=2000

multipart:
  enabled: true

spring.servlet.multipart.max-file-size: -1
spring.servlet.multipart.max-request-size: -1
cas.tenant.identifier: -1
server:
  host:
  port: 8090
  ssl:
    key-store: ../../../dev-deployment/environments/keystores/vitamui-services/servers/keystore_collect.p12
    key-store-password: changeme
    key-password: changeme
    trust-store: ../../../dev-deployment/environments/keystores/vitamui-services/truststore_vitamui-services.p12
    trust-store-password: changeme
    client-auth: want
    enabled-protocols: TLSv1.2,TLSv1.3
    ciphers: ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384
    client-certificate-header-name: x-ssl-cert

management:
  server:
    address: localhost
    port: 8190

collect:
  security-client:
    server-host: localhost
    server-port: 8084
    secure: false
  iam-client:
    server-host: localhost
    server-port: 8083
    secure: true
    ssl-configuration:
      truststore:
        key-path: ../../../dev-deployment/environments/keystores/vitamui-services/truststore_vitamui-services.p12
        key-password: changeme
      keystore:
        key-path: ../../../dev-deployment/environments/keystores/vitamui-services/clients/keystore_collect.p12
        key-password: changeme
      hostname-verification: false

# Jaeger
opentracing:
  jaeger:
    enabled: true
    logSpans: true
    expandExceptionLogs: true
    udp-sender:
      host: localhost
      port: 6831

logging:
  level:
    fr.gouv.vitamui.collect: DEBUG
    fr.gouv.vitamui.iam.security: INFO
    fr.gouv.vitam.collect: DEBUG
    fr.gouv.vitam.collect.*: DEBUG
    reactor.netty.*: DEBUG
#    org.springframework.core.env: DEBUG

# ontology fields file path
ontologies_file_path: "src/main/resources/ontology/external_ontology_fields.json"
