spring:
  application:
    name: iam
    version: '@project.version@'
  api:
    name: API IAM - Gestion des accès aux identités
    description: Ces APIS sont utilisés pour configurer les clients, tenants, idp, groupes, profiles, et utilisateurs.
    version: v1
  cloud:
    bus:
      enabled: false
    discovery:
      enabled: false
    consul:
      enabled: false
      config:
        enabled: false
  data:
    mongodb:
      auto-index-creation: true

iam:
  security-client:
    server-host: localhost
    server-port: 8084
    secure: false

login.url: http://cas/login
login.attempts.maximum.failures: 5
login.attempts.time.interval: 20

token.ttl: 15
token.additional.ttl: 15
subrogaton.token.ttl: 165
api.token.ttl: 480
generic.users.subrogation.ttl: 180
subrogation.ttl: 30

logbook.scheduling.sendEventToVitamTasks.enabled: false

discussion:
  scheduling:
    purgeTransactionDiscussions:
      enabled: true
      cronExpression: 0 */5 * ? * *

customer.init.config.file: src/test/resources/customer-init.yml

cas.reset.password.url: /extras/resetPassword?username={username}&firstname={firstname}&lastname={lastname}&language={language}&customerId={customerId}&ttl=1day
cas.tenant.identifier: -1
cas_secret_token: tokcas_ie6UZsEcHIWrfv2x

download:
  signed-url:
    secret: tokdownload_ie6UZsEcHIWrfv2x
    ttl-seconds: 60
    clock-skew-seconds: 5

address:
  max-street-length: 250

# Password configuration
password:
  max-old-password: 12 # default is 3

user.connection.tracing.enabled: true

swagger:
  layer: api-external

cas-client:
  server-host: dev.vitamui.com
  server-port: 8080
  secure: true
  ssl-configuration:
    truststore:
      key-path: ../../../dev-deployment/environments/keystores/vitamui-services/truststore_vitamui-services.p12
      key-password: changeme
    keystore:
      key-path: ../../../dev-deployment/environments/keystores/vitamui-services/servers/keystore_iam.p12
      key-password: changeme
    hostname-verification: false
