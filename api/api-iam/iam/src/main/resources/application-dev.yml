debug: false

spring:
  web:
    error:
      path: /error

  config:
    use-legacy-processing: true
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

  cloud:
    consul: #disabled for dev
      enabled: false
      discovery:
        enabled: false
        register: false
  mongodb:
    uri: mongodb://mongod_dbuser_iam:mongod_dbpwd_iam@localhost:27018/iam?connectTimeoutMS=2000

discussion:
  mongodb:
    uri: mongodb://mongod_dbuser_discussions:mongod_dbpwd_discussions@localhost:27018/discussions?connectTimeoutMS=2000
  scheduling:
    purgeTransactionDiscussions:
      enabled: true
      cronExpression: 0 */5 * ? * *

server:
  host:
  port: 8083
  ssl:
    key-store: ../../../dev-deployment/environments/keystores/vitamui-services/servers/keystore_iam.p12
    key-store-password: changeme
    key-password: changeme
    trust-store: ../../../dev-deployment/environments/keystores/vitamui-services/truststore_vitamui-services.p12
    trust-store-password: changeme
    client-auth: want
    enabled-protocols: TLSv1.2,TLSv1.3
    ciphers: ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384
    client-certificate-header-name: x-ssl-cert

  tomcat:
    connection-timeout: 60000
    accesslog:
      enabled: true
      max-days: 365
      directory: "/vitamui/log/iam"
      prefix: "accesslog-iam"
      file-date-format: ".yyyy-MM-dd"
      suffix: ".log"

management:
  server:
    address: localhost
    port: 8183
    ssl:
      enabled: false

iam:
  security-client:
    server-host: localhost
    server-port: 8084
    secure: false

cas-client:
  server-host: dev.vitamui.com
  server-port: 8080
  secure: true
  ssl-configuration:
    truststore:
      key-path: ../../../dev-deployment/environments/keystores/vitamui-services/truststore_vitamui-services.p12
      key-password: changeme
    keystore:
      key-path: ../../../dev-deployment/environments/keystores/vitamui-services/clients/keystore_iam.p12
      key-password: changeme
    hostname-verification: false

cas.reset.password.url: /cas/extras/resetPassword?username={username}&firstname={firstname}&lastname={lastname}&language={language}&customerId={customerId}&ttl=1day
cas.tenant.identifier: -1
cas_secret_token: tokcas_ie6UZsEcHIWrfv2x

download:
  signed-url:
    secret: tokdownload_ie6UZsEcHIWrfv2x
    ttl-seconds: 60
    clock-skew-seconds: 5

login:
  url: http://dev.vitamui.com:8080/cas/login
  attempts:
    maximum.failures: 5
    time.interval: 20

logbook:
  scheduling:
    enabled: false
    sendEventToVitamTasks:
      delay: 10000

vitam.tenant.init.mandatory: true

customer.init.config.file: src/main/resources/dev/customer-init.yml

user.connection.tracing.enabled: false

# Jaeger
opentracing:
  jaeger:
    enabled: true
    logSpans: true
    expandExceptionLogs: true
    udp-sender:
      host: localhost
      port: 6831

logging:
  level:
    fr.gouv.vitamui: DEBUG
    fr.gouv.vitamui.iam.security: DEBUG
    fr.gouv.vitamui.commons.mongo.service: DEBUG
    fr.gouv.vitamui.iam.server: DEBUG
    fr.gouv.vitamui.commons.logbook.scheduler: DEBUG
    # org.springframework.data.mongodb.core.MongoTemplate: DEBUG

gdpr_alert_readonly: true

provisioning-client:
  identity-providers:
    - idp-identifier: system_idp
      uri: "http://localhost:1080/provisioning/v1/users"
      client:
        secure: false
        ssl-configuration:
          keystore:
            key-path: ../../../dev-deployment/environments/keystores/vitamui-services/clients/keystore_iam.p12
            key-password: changeme
          truststore:
            key-path: ../../../dev-deployment/environments/keystores/vitamui-services/truststore_vitamui-services.p12
            key-password: changeme
          hostname-verification: false
    - idp-identifier: 2
      uri: https://localhost:8090/provisioning/v1/users
      client:
        secure: true
        ssl-configuration:
          keystore:
            key-path: ../../../dev-deployment/environments/keystores/vitamui-services/clients/keystore_iam.p12
            key-password: changeme
          truststore:
            key-path: ../../../dev-deployment/environments/keystores/vitamui-services/truststore_vitamui-services.p12
            key-password: changeme
          hostname-verification: false

address:
  max-street-length: 250

# Password configuration
password:
  max-old-password: 12

cas:
  external-url: https://dev.vitamui.com:8080/cas
