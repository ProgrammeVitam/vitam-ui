# TECHNICAL PROPERTIES / DON'T put environment properties
# This property can be override by a config file give at run time with spring.config.location

spring:
  application:
    name: iam
    version: '@project.version@'
  api:
    name: API IAM (Identity Access Management)
    description: This API is used to manage customers, tenants, identity providers, users with their profiles and their profiles groups.
    version: v1
  jmx:
    unique-names: true

management:
  endpoints:
    jmx:
      domain: iam
    web.exposure.include: '*'
  endpoint:
    health:
      show-details: always

swagger:
  layer: api-external
  file-path: file:../../../tools/swagger/docs/api-external/iam/swagger.json

metrics:
  reporterInterval: 1
  reporterIntervalUnit: MINUTES
  index: metrics-vitam-jvm

# Tokens TTL
token.max-ttl: 480 # 8 (hours) * 60 (minutes)
token.ttl: 240 # 4 (hours) * 60 (minutes)
token.additional.ttl: 15
subrogaton.token.ttl: 165
api.token.ttl: 480
generic.users.subrogation.ttl: 180
subrogation.ttl: 30

cas.reset.password.url: /extras/resetPassword?username={username}&firstname={firstname}&lastname={lastname}&language={language}&customerId={customerId}&ttl=1day

user.connection.tracing.enabled: false

# Encryption key for IdP secret fields (clientSecret, keystoreBase64, keystorePassword,
# privateKeyPassword) — 32 raw bytes base64. When set, EncryptedSecretCipher encrypts them at rest.
# When null (default), the cipher runs in PASSTHROUGH: values are stored in the clear and a WARN
# is logged at boot. This is a deliberate choice — an embedded dev key would give a false sense of
# security since anyone with source access could decrypt. Ops opts in explicitly by pasting a real
# key here (per-env config file, out of git). Generate one with: openssl rand -base64 32
# Kept under `secrets.*` rather than `iam.*` because ApiIamApplicationProperties binds `iam.*` with
# ignoreUnknownFields=false and would refuse an ad-hoc property in its namespace.
secrets:
  idp-key: ~

gateway:
  enabled: true
