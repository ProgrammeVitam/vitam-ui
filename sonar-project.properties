sonar.organization=programmevitam-1
sonar.projectKey=programmevitam-1_vitam-ui

# relative paths to source directories. More details and properties are described
# in https://sonarcloud.io/documentation/project-administration/narrowing-the-focus/
sonar.sources=.
sonar.java.binaries=.
# "**.jar" because of https://sonarsource.atlassian.net/browse/SONARJAVA-1965
# "lib" directory is created and populated with m2 repository content by the GitHub Action
# "target" directories are restored from the backend-generated-classes artifact by the GitHub Action
sonar.java.libraries=lib/**.jar
sonar.java.test.binaries=**/target/test-classes
sonar.java.test.libraries=lib/**.jar

# Tracked Python files are generic python3 scripts (ansible filter plugins, sphinx conf.py);
# pin the analyzer to the modern supported range instead of the default guess
sonar.python.version=3.10, 3.11, 3.12, 3.13

# "lib" directory is created and populated with m2 repository content by the GitHub Action.
# It is only referenced through sonar.java.libraries and must not be indexed as sources
sonar.exclusions=**/node_modules/**, **/target/**, lib/**, tools/swagger/docs/**, **/src/test/**, **/*.spec.ts, dev-deployment/**/*.key, tools/**/*.key, **/*.properties, **/*.p12, **/*.jks, **/*.der, **/*.pfx, **/*.png, **/*.jpg, **/*.jpeg, **/*.ico, **/*.gif, **/*.woff, **/*.woff2, **/*.ttf, **/*.eot, **/*.otf, **/*.pdf, **/*.odt, **/*.ods, **/*.odp, **/*.zip, **/*.so
sonar.tests=.
sonar.test.inclusions=**/src/test/**, **/*.spec.ts
# test files matching test inclusions are indexed even when excluded from sources,
# so binary extensions must also be excluded from tests
sonar.test.exclusions=**/*.p12, **/*.jks, **/*.der, **/*.pfx, **/*.png, **/*.jpg, **/*.jpeg, **/*.ico, **/*.gif, **/*.woff, **/*.woff2, **/*.ttf, **/*.eot, **/*.otf, **/*.pdf, **/*.odt, **/*.ods, **/*.odp, **/*.zip, **/*.so
sonar.javascript.lcov.reportPaths=ui/ui-frontend/coverage/**/lcov.info
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# Dev-only credentials (local docker / application-dev.yml / application-recette.yml):
# never deployed, required for local dev. Exclusions are scoped per rule to the
# exact files Sonar reports (31 issues, all dev-only), so any new secret anywhere
# else is still reported. Fixes secrets:S6418/S6694/S8215, yaml:S6418/S2068, json:S6418.
sonar.issue.ignore.multicriteria=s1,s2,s3,s4,s5,s6
sonar.issue.ignore.multicriteria.s1.ruleKey=secrets:S6418
sonar.issue.ignore.multicriteria.s1.resourceKey=tools/docker/keycloak/.env
sonar.issue.ignore.multicriteria.s2.ruleKey=secrets:S6694
sonar.issue.ignore.multicriteria.s2.resourceKey=api/api-archive-search/archive-search/src/main/resources/application-dev.yml,api/api-collect/collect/src/main/resources/application-dev.yml,api/api-iam/iam/src/main/resources/application-dev.yml,api/api-security/security/src/main/resources/application-dev.yml,cas/cas-server/src/main/config/application-dev.yml,cas/cas-server/src/main/config/application-recette.yml,tools/docker/keycloak/.env,tools/docker/mongo/mongo_dev.yml
sonar.issue.ignore.multicriteria.s3.ruleKey=secrets:S8215
sonar.issue.ignore.multicriteria.s3.resourceKey=tools/docker/mongo/mongo_vars_dev.yml
sonar.issue.ignore.multicriteria.s4.ruleKey=yaml:S6418
sonar.issue.ignore.multicriteria.s4.resourceKey=api/api-archive-search/archive-search/src/main/resources/application-dev.yml,api/api-collect/collect/src/main/resources/application-dev.yml,api/api-iam/iam/src/main/resources/application-dev.yml,api/api-ingest/ingest/src/main/resources/application-dev.yml
sonar.issue.ignore.multicriteria.s5.ruleKey=yaml:S2068
sonar.issue.ignore.multicriteria.s5.resourceKey=api/api-archive-search/archive-search/src/main/resources/application-dev.yml,api/api-collect/collect/src/main/resources/application-dev.yml,api/api-iam/iam/src/main/resources/application-dev.yml,api/api-security/security/src/main/resources/application-dev.yml,cas/cas-server/src/main/config/application-dev.yml,cas/cas-server/src/main/config/application-recette.yml,tools/docker/mongo/mongo_vars_dev.yml
sonar.issue.ignore.multicriteria.s6.ruleKey=json:S6418
sonar.issue.ignore.multicriteria.s6.resourceKey=tools/docker/keycloak/realms/vitamui-realm.json
