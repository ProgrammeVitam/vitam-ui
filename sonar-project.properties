sonar.organization=programme-vitam3
sonar.projectKey=programme-vitam3_vitam-ui

# relative paths to source directories. More details and properties are described
# in https://sonarcloud.io/documentation/project-administration/narrowing-the-focus/
sonar.sources=.
sonar.java.binaries=.
# "**.jar" because of https://sonarsource.atlassian.net/browse/SONARJAVA-1965
# "lib" directory is created and populated with m2 repository content by the GitHub Action
# "target" directories are restored from the backend-generated-classes artifact by the GitHub Action
sonar.java.libraries=lib/**.jar
sonar.java.test.binaries=**/target/test-classes
sonar.java.test.libraries=lib/**.jar

# Tracked Python files are generic python3 scripts (ansible filter plugins, sphinx conf.py);
# pin the analyzer to the modern supported range instead of the default guess
sonar.python.version=3.10, 3.11, 3.12, 3.13

# "lib" directory is created and populated with m2 repository content by the GitHub Action.
# It is only referenced through sonar.java.libraries and must not be indexed as sources
sonar.exclusions=**/node_modules/**, **/target/**, lib/**, tools/swagger/docs/**, **/src/test/**, **/*.spec.ts, dev-deployment/**/*.key, tools/**/*.key, **/*.properties
sonar.tests=.
sonar.test.inclusions=**/src/test/**, **/*.spec.ts
sonar.javascript.lcov.reportPaths=ui/ui-frontend/coverage/**/lcov.info
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
